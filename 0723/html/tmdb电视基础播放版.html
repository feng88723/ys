<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TMDB影视 TV</title>
<style>
:root{
  color-scheme:dark;
  --side-w:86px;
  --rainbow:linear-gradient(90deg,#ff2d55,#ff8a00,#ffe600,#35e36f,#19d8ff,#526cff,#a94dff,#ff3cac,#ff2d55);
  --rainbow50:linear-gradient(90deg,rgba(255,45,85,.5),rgba(255,138,0,.5),rgba(255,230,0,.5),rgba(53,227,111,.5),rgba(25,216,255,.5),rgba(82,108,255,.5),rgba(169,77,255,.5),rgba(255,60,172,.5),rgba(255,45,85,.5));
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:transparent!important;
  color:#fff;
  -webkit-tap-highlight-color:transparent
}
button,input{
  font:inherit;
  color:inherit
}
button{
  border:0;
  outline:0;
  margin:0;
  padding:0;
  background:transparent;
  appearance:none;
  -webkit-appearance:none;
  cursor:pointer
}
img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover
}
[hidden]{display:none!important}

@keyframes rb{
  0%{background-position:0 50%}
  50%{background-position:100% 50%}
  100%{background-position:0 50%}
}
@keyframes shimmer{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}

.rainbow-focus{
  position:relative;
  border:3px solid transparent;
  outline:0;
  background:transparent;
  box-shadow:none
}
.rainbow-focus:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:40;
  padding:2px;
  border-radius:inherit;
  pointer-events:none;
  opacity:0;
  background:var(--rainbow);
  background-size:300% 300%;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude
}
.rainbow-focus:focus:before,
.rainbow-focus:focus-visible:before{
  opacity:1;
  animation:rb 2.4s linear infinite
}
.fill-focus:focus,
.fill-focus:focus-visible{
  color:#fff!important;
  background:var(--rainbow50)!important;
  background-size:300% 300%!important;
  animation:rb 3s linear infinite!important
}

/* 侧边栏 */
.side-nav{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:var(--side-w);
  z-index:9000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:transparent!important;
  transform:translateX(-110%);
  opacity:0;
  pointer-events:none;
  transition:.16s
}
body.side-open .side-nav{
  transform:translateX(0);
  opacity:1;
  pointer-events:auto
}
.side-btn{
  width:48px;
  height:48px;
  border-radius:999px;
  display:grid;
  place-items:center;
  color:#fff
}
.side-btn svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.35;
  stroke-linecap:round;
  stroke-linejoin:round
}

/* 分类侧栏 */
.cat-panel{
  display:none;
  position:fixed;
  left:calc(var(--side-w) + 12px);
  top:50%;
  transform:translateY(-50%);
  z-index:9050;
  width:200px;
  max-height:350px;
  overflow-y:auto;
  background:transparent!important;
  scrollbar-width:none
}
.cat-panel::-webkit-scrollbar{display:none}
body.cat-open .cat-panel{display:block}
.cat-item{
  display:block;
  width:max-content;
  min-width:86px;
  height:34px;
  margin:5px 0;
  padding:0 12px;
  border-radius:10px;
  font-size:15px;
  font-weight:900;
  text-align:left;
  white-space:nowrap;
  color:#fff
}
.cat-item.current:not(:focus){
  color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,.8)
}

/* 搜索 */
.search-layer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9500;
  background:transparent!important
}
body.search-open .search-layer{display:block}
.search-box{
  position:fixed;
  left:18vw;
  right:22vw;
  top:42px;
  display:grid;
  grid-template-columns:86px minmax(0,1fr) 72px;
  gap:12px
}
.search-back,
.search-submit{
  height:58px;
  border-radius:999px;
  font-weight:950;
  background:rgba(0,0,0,.12)
}
.search-input{
  height:58px;
  border-radius:999px;
  border:2px solid rgba(255,255,255,.28);
  background:rgba(0,0,0,.12);
  padding:0 24px;
  font-size:21px
}
.search-input:focus,
.search-input:focus-visible{
  border-color:#fff;
  box-shadow:0 0 0 3px rgba(25,216,255,.55);
  outline:0
}
.search-panel{
  position:fixed;
  left:18vw;
  right:22vw;
  top:116px;
  max-height:calc(100vh - 150px);
  overflow-y:auto;
  scrollbar-width:none
}
.search-panel::-webkit-scrollbar{display:none}
.search-item{
  width:100%;
  min-height:82px;
  padding:10px;
  display:grid;
  grid-template-columns:58px minmax(0,1fr);
  gap:12px;
  align-items:center;
  border-radius:16px;
  text-align:left;
  background:rgba(0,0,0,.08)
}
.search-item img{
  width:58px;
  height:76px;
  border-radius:8px
}
.search-title{
  font-size:18px;
  font-weight:900
}
.search-meta{
  margin-top:5px;
  font-size:13px;
  color:rgba(255,255,255,.72)
}

/* 首页 */
.app{
  min-height:100vh;
  padding:18px 54px 48px 72px;
  background:transparent!important
}
.top-tabs-wrap{
  width:100%;
  margin:0 auto 12px;
  padding:0 96px;
  overflow:visible
}
.top-tabs{
  width:100%;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  gap:8px;
  overflow-x:auto;
  overflow-y:visible;
  scrollbar-width:none;
  scroll-padding-left:28px;
  scroll-padding-right:28px
}
.top-tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex:0 0 auto;
  min-width:116px;
  height:46px;
  padding:0 24px;
  border-radius:999px;
  color:rgba(255,255,255,.76);
  font-size:18px;
  font-weight:900;
  white-space:nowrap
}
.tab-btn.active{
  color:#fff;
  background:var(--rainbow50)!important;
  background-size:300% 300%!important;
  animation:rb 3s linear infinite!important
}
.hero-card{
  position:relative;
  width:100%;
  height:clamp(460px,60vh,610px)!important;
  min-height:460px!important;
  overflow:hidden;
  border-radius:14px;
  text-align:left;
  background:transparent!important
}
.bg-stack{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:transparent!important
}
.bg-layer{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  background-color:transparent!important;
  opacity:0;
  transition:opacity .28s ease;
  transform:scale(1.01);
  will-change:opacity
}
.bg-layer.active{opacity:1}
.bg-stack:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.56),rgba(0,0,0,.16) 46%,rgba(0,0,0,.02)),
    linear-gradient(0deg,rgba(0,0,0,.32),transparent 56%)
}
.bg-stack.loading:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
  animation:shimmer 1.1s infinite
}
.hero-fake{display:none!important}
.hero-copy{
  position:absolute;
  left:44px!important;
  bottom:34px!important;
  z-index:3;
  width:33vw!important;
  max-width:33vw!important;
  pointer-events:none;
  background:transparent!important;
  text-shadow:0 3px 16px rgba(0,0,0,.55)!important
}
.hero-badge{display:none!important}
.hero-title{
  margin:0;
  width:33vw!important;
  max-width:33vw!important;
  font-size:clamp(30px,3vw,48px);
  line-height:1.08;
  font-weight:900;
  color:rgba(255,255,255,.72)!important;
  text-shadow:0 3px 16px rgba(0,0,0,.55)!important;
  display:-webkit-box!important;
  -webkit-line-clamp:2!important;
  -webkit-box-orient:vertical!important;
  overflow:hidden!important
}
.hero-meta{
  margin-top:8px;
  width:33vw!important;
  max-width:33vw!important;
  font-size:14px!important;
  line-height:1.36!important;
  color:rgba(255,255,255,.64)!important;
  text-shadow:0 2px 10px rgba(0,0,0,.55);
  display:-webkit-box!important;
  -webkit-line-clamp:2!important;
  -webkit-box-orient:vertical!important;
  overflow:hidden!important
}
.hero-dots{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:8px 0 4px
}
.hero-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(255,255,255,.38)
}
.hero-dot.active{background:#fff}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 0 14px
}
.section-head h2{
  margin:0;
  font-size:24px;
  font-weight:850;
  text-shadow:0 2px 8px #000
}
.section-head small{color:rgba(255,255,255,.72)}
.grid,
.cast-grid,
.person-work-grid,
.recommend-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr))!important;
  gap:18px
}
.vod-card,
.person-card{
  position:relative;
  aspect-ratio:2/3;
  overflow:hidden;
  border-radius:12px;
  text-align:left;
  background:transparent!important
}
.vod-card:focus,
.person-card:focus{
  z-index:5;
  transform:scale(1.035)
}
.vod-info,
.person-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:2;
  padding:48px 12px 12px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.86))
}
.vod-title,
.vod-remark,
.person-name,
.person-role{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-shadow:0 2px 8px #000
}
.vod-title,
.person-name{
  font-size:15px;
  font-weight:900
}
.vod-remark,
.person-role{
  margin-top:5px;
  font-size:12px;
  color:rgba(255,255,255,.72)
}
.page-sentinel{
  width:100%;
  height:44px;
  margin-top:18px;
  display:grid;
  place-items:center;
  color:rgba(255,255,255,.66);
  font-size:14px;
  pointer-events:none
}
.page-sentinel.loading:after{content:"正在加载下一页..."}
.page-sentinel.end:after{content:"已经到底了"}
.empty{
  min-height:110px;
  display:grid;
  place-items:center;
  color:rgba(255,255,255,.74);
  text-align:center;
  text-shadow:0 2px 8px #000
}

/* 详情 */
.detail{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  width:100vw;
  height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
  background:transparent!important;
  color:#fff;
  overscroll-behavior:contain
}
.detail.active{display:block}
.detail-bg-stack{
  position:fixed;
  inset:0;
  z-index:0;
  background:transparent!important
}
.detail-bg-stack:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.24),rgba(0,0,0,.03)),
    linear-gradient(0deg,rgba(0,0,0,.84),transparent 74%)
}
.detail-first{
  position:relative;
  z-index:2;
  height:100vh;
  min-height:100vh
}
.detail.second-open .detail-copy{
  visibility:hidden!important;
  opacity:0!important;
  pointer-events:none!important
}
.detail-copy{
  position:absolute;
  left:72px!important;
  bottom:34px!important;
  width:33vw!important;
  max-width:33vw!important;
  height:62vh!important;
  display:flex!important;
  flex-direction:column!important;
  pointer-events:none;
  background:transparent!important;
  text-shadow:0 3px 16px rgba(0,0,0,.55)!important
}
.detail-title-zone{
  width:33vw!important;
  max-width:33vw!important;
  height:158px!important;
  min-height:158px!important;
  max-height:158px!important;
  padding:18px 16px 0 0!important;
  margin-top:10px!important;
  overflow:visible!important;
  flex:0 0 auto!important
}
.detail-title-row{
  width:33vw!important;
  max-width:33vw!important;
  height:140px!important;
  min-height:140px!important;
  display:flex;
  align-items:flex-end!important;
  overflow:visible!important
}
.detail-title-main,
.detail-title{
  margin:0;
  width:33vw!important;
  max-width:33vw!important;
  line-height:1.06;
  font-size:clamp(38px,5.2vw,64px);
  font-weight:900;
  color:rgba(255,255,255,.72)!important;
  text-shadow:0 4px 20px rgba(0,0,0,.62)!important;
  display:-webkit-box!important;
  -webkit-line-clamp:2!important;
  -webkit-box-orient:vertical!important;
  overflow:hidden!important
}
.detail-title-logo{
  display:none;
  width:auto!important;
  height:auto!important;
  max-width:calc(33vw - 8px)!important;
  max-height:126px!important;
  object-fit:contain!important;
  object-position:left bottom!important;
  margin:0 0 4px!important;
  filter:drop-shadow(0 5px 22px rgba(0,0,0,.62))!important
}
.detail-title-row.has-logo .detail-title-main{display:none!important}
.detail-title-row.has-logo .detail-title-logo{display:block!important}
.detail-title-variant{display:none!important}
.detail-meta{
  margin-top:14px!important;
  width:33vw!important;
  max-width:33vw!important;
  min-height:22px;
  font-size:clamp(10px,.86vw,13px);
  line-height:1.28;
  color:rgba(255,255,255,.62)!important;
  pointer-events:auto;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical
}
.detail-desc{
  margin-top:10px!important;
  width:33vw!important;
  max-width:33vw!important;
  font-size:clamp(11px,.86vw,14px);
  line-height:1.36;
  color:rgba(255,255,255,.64)!important;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  pointer-events:auto
}
.detail-actions{
  margin-top:auto!important;
  margin-bottom:0!important;
  display:flex!important;
  gap:14px!important;
  flex:0 0 auto!important;
  pointer-events:auto
}
.detail-btn{
  width:auto;
  min-width:0;
  height:40px;
  padding:0 18px;
  border-radius:999px;
  font-size:15px;
  font-weight:950;
  background:transparent!important
}
.detail.pan-open .detail-meta,
.detail.pan-open .detail-desc{display:none!important}
.detail.pan-open #detailBackBtn{display:none!important}

/* 盘搜 */
.pan-zone{
  display:none!important;
  width:33vw!important;
  max-width:33vw!important;
  margin-top:10px!important;
  flex:0 0 auto!important;
  pointer-events:auto
}
.detail.pan-open .pan-zone{display:block!important}
.pan-title{display:none!important}
.pan-layout{
  display:grid!important;
  grid-template-rows:34px 174px!important;
  grid-template-columns:1fr!important;
  gap:8px!important;
  width:33vw!important;
  max-width:33vw!important
}
.pan-types{
  width:33vw!important;
  max-width:33vw!important;
  height:34px!important;
  display:flex!important;
  flex-direction:row!important;
  gap:8px!important;
  overflow-x:auto!important;
  overflow-y:hidden!important;
  scrollbar-width:none!important;
  padding-bottom:2px;
  overscroll-behavior:contain
}
.pan-types::-webkit-scrollbar{display:none}
.pan-type{
  flex:0 0 auto;
  width:auto;
  min-width:0;
  height:32px;
  padding:0 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:950;
  text-align:center;
  white-space:nowrap;
  background:rgba(0,0,0,.10)
}
.pan-type.current:not(:focus){
  color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,.9)
}
.pan-results{
  position:relative;
  width:33vw!important;
  max-width:33vw!important;
  height:174px!important;
  min-height:174px!important;
  max-height:174px!important;
  display:flex!important;
  flex-direction:column!important;
  gap:6px!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  scrollbar-width:none!important;
  padding-right:2px;
  overscroll-behavior:contain!important;
  scroll-behavior:auto!important;
  -webkit-overflow-scrolling:touch;
  will-change:scroll-position
}
.pan-results::-webkit-scrollbar{display:none}
.pan-item{
  flex:0 0 50px!important;
  flex-shrink:0!important;
  width:33vw!important;
  max-width:33vw!important;
  min-height:50px!important;
  height:50px!important;
  max-height:50px!important;
  border-radius:12px!important;
  padding:7px 11px!important;
  text-align:left;
  background:rgba(0,0,0,.08)!important;
  overflow:hidden;
  display:grid;
  grid-template-columns:14px minmax(0,1fr);
  align-items:center;
  gap:8px
}
.pan-item.resolving{opacity:.7}
.pan-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.30)
}
.pan-dot.checking{
  background:#19d8ff;
  box-shadow:0 0 8px rgba(25,216,255,.75)
}
.pan-dot.ok{
  background:#35e36f;
  box-shadow:0 0 8px rgba(53,227,111,.75)
}
.pan-dot.locked{
  background:#ffe600;
  box-shadow:0 0 8px rgba(255,230,0,.75)
}
.pan-dot.uncertain,
.pan-dot.unsupported{
  background:#ff8a00;
  box-shadow:0 0 8px rgba(255,138,0,.7)
}
.pan-dot.bad{
  background:#ff2d55;
  box-shadow:0 0 8px rgba(255,45,85,.7)
}
.pan-item-title{
  width:calc(33vw - 42px)!important;
  max-width:calc(33vw - 42px)!important;
  font-size:13px!important;
  font-weight:850;
  line-height:1.32!important;
  white-space:normal;
  display:-webkit-box!important;
  -webkit-line-clamp:2!important;
  -webkit-box-orient:vertical!important;
  overflow:hidden!important
}
.pan-item-meta{display:none!important}

/* 盘搜打开时给资源框腾出稳定空间 */
.detail.pan-open .detail-title-zone{
  height:136px!important;
  min-height:136px!important;
  max-height:136px!important
}
.detail.pan-open .detail-title-row{
  height:118px!important;
  min-height:118px!important
}

/* 详情第二屏 */
.detail-second{
  position:relative;
  z-index:3;
  width:calc(100vw - 144px);
  height:calc(100vh - 54px);
  margin:0 72px 80px;
  display:grid;
  grid-template-rows:58px minmax(0,1fr)
}
.detail-tabs{
  display:flex;
  align-items:center;
  gap:34px;
  height:58px;
  border-bottom:1px solid rgba(255,255,255,.28)
}
.detail-tab{
  position:relative;
  min-width:112px;
  height:42px;
  border-radius:999px;
  padding:0 18px;
  font-size:20px;
  font-weight:900;
  color:rgba(255,255,255,.72);
  background:transparent!important
}
.detail-tab.active{
  color:#fff!important;
  background:transparent!important;
  animation:none!important;
  text-shadow:0 0 10px rgba(255,255,255,.72)
}
.detail-tab.active:after{
  content:"";
  position:absolute;
  left:24%;
  right:24%;
  bottom:-7px;
  height:4px;
  border-radius:999px;
  background:var(--rainbow);
  background-size:300% 300%;
  animation:rb 2.4s linear infinite;
  box-shadow:
    0 0 8px rgba(25,216,255,.55),
    0 0 12px rgba(255,45,85,.35)
}
.tab-viewport{
  height:100%;
  overflow:hidden
}
.tab-content{
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  padding:16px 0 100px;
  scrollbar-width:none
}
.tab-content::-webkit-scrollbar{display:none}
.tab-block{display:none}
.tab-block.active{display:block}
.tab-title{
  margin:18px 0 12px;
  font-size:19px;
  font-weight:950
}
.info-text{
  font-size:17px;
  line-height:1.72
}
.info-row{margin:0 0 9px}
.info-label{font-weight:950}
.season-layout{
  display:grid;
  grid-template-columns:170px minmax(0,1fr);
  gap:26px
}
.season-tabs{
  display:flex;
  flex-direction:column;
  gap:10px
}
.season-tab{
  height:38px;
  border-radius:999px;
  font-size:14px;
  font-weight:900
}
.episode-rail{
  display:flex;
  flex-direction:column;
  gap:14px
}
.episode-card{
  display:grid;
  grid-template-columns:230px minmax(0,1fr) 72px;
  gap:20px;
  align-items:center;
  min-height:116px;
  text-align:left;
  border-radius:10px
}
.episode-still{
  width:230px;
  height:129px;
  border-radius:10px;
  overflow:hidden
}
.episode-title{
  font-size:17px;
  font-weight:900
}
.episode-meta{
  font-size:13px;
  color:rgba(255,255,255,.72);
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden
}
.stills-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr))!important;
  gap:14px
}
.still-card{
  aspect-ratio:16/9;
  border-radius:10px;
  overflow:hidden
}
.still-card:focus{
  z-index:5;
  transform:scale(1.025)
}

/* 图片查看 */
.viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:99999;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.96);
  padding:24px
}
.viewer.active{display:flex}
.viewer img{
  width:auto;
  height:auto;
  max-width:96vw;
  max-height:92vh;
  object-fit:contain;
  border-radius:8px
}
.viewer-count{
  position:fixed;
  right:32px;
  top:24px;
  font-size:18px;
  font-weight:900
}
.toast{
  position:fixed;
  left:50%;
  bottom:42px;
  transform:translateX(-50%);
  z-index:999999;
  padding:10px 18px;
  border-radius:999px;
  background:rgba(0,0,0,.72);
  opacity:0;
  transition:.18s
}
.toast.show{opacity:1}

@media(max-width:980px){
  .app{padding:16px 16px 48px}
  .top-tabs-wrap{padding:0 24px}
  .grid,
  .cast-grid,
  .person-work-grid,
  .recommend-grid{gap:10px}
  .hero-copy,
  .hero-title,
  .hero-meta{
    width:55vw!important;
    max-width:55vw!important

  .hero-copy{

  .detail-meta,
  .detail-desc,
  .pan-zone,
  .pan-layout,

/* =========================================================

function isNative(){
  return Boolean(
    window.fm&&

function canNativeRes(){

async function browserRequest(url,opt={}){
  const timeout=Number(
    opt.timeout||
    20
  );

  const controller=
    typeof AbortController==="function"
      ?new AbortController()
      :null;

  const timer=controller
    ?setTimeout(()=>{
      controller.abort();
    },timeout*1000)
    :0;

  try{
    const method=
      String(
        opt.method||
        "GET"
      ).toUpperCase();

    const response=await fetch(url,{
      method,

      headers:
        opt.headers||
        {},

      body:
        method!=="GET"&&
        method!=="HEAD"
          ?(
            opt.body===undefined
              ?undefined
              :opt.body
          )
          :undefined,

      signal:
        controller
          ?controller.signal
          :undefined,

      mode:"cors",
      credentials:"omit"
    });

    const text=await response.text();

    return{
      status:response.status,
      code:response.status,
      body:text,
      text,
      headers:{}
    };
  }finally{
    if(timer){
      clearTimeout(timer);
    }
  }
}

let nativeSdkWait=null;

function waitForNativeSdk(timeout=1500){
  if(
    window.fm||
    !window.fongmiBridge
  ){
    return Promise.resolve(
      Boolean(window.fm)
    );
  }

  if(nativeSdkWait){
    return nativeSdkWait;
  }

  nativeSdkWait=new Promise(resolve=>{
    let done=false;

    const finish=()=>{
      if(done){
        return;
      }

      done=true;
      window.removeEventListener(
        "fmsdk",
        finish
      );
      nativeSdkWait=null;

      resolve(
        Boolean(window.fm)
      );
    };

    window.addEventListener(
      "fmsdk",
      finish
    );

    setTimeout(
      finish,
      timeout==null
        ?1500
        :timeout
    );
  });

  return nativeSdkWait;
}

function sdk(){
  if(window.fm){
    const base={};

    Object.keys(window.fm).forEach(key=>{
      try{
        const value=window.fm[key];
        base[key]=
          typeof value==="function"
            ?value.bind(window.fm)
            :value;
      }catch(error){}
    });

    base.req=
      typeof window.fm.req==="function"
        ?window.fm.req.bind(window.fm)
        :browserRequest;

    base.res=
      typeof window.fm.res==="function"
        ?window.fm.res.bind(window.fm)
        :(url=>url);

    const nativePan=
      window.fm.pan||
      {};

    const pan={};

    Object.keys(nativePan).forEach(key=>{
      try{
        const value=nativePan[key];
        pan[key]=
          typeof value==="function"
            ?value.bind(nativePan)
            :value;
      }catch(error){}
    });

    if(
      !pan.check&&
      typeof window.fm.check==="function"
    ){
      pan.check=window.fm.check.bind(window.fm);
    }

    base.pan=pan;
    base.check=pan.check||base.check;

    return base;
  }

  const check=async items=>({
    results:(items||[]).map(item=>({
      type:item.type,
      url:item.url,
      normalized_url:item.url,
      state:"idle",
      summary:"浏览器预览不检测",
      cache_hit:false,

    }))
  });

  const play=async payload=>{

      }

        "noopener,noreferrer"
      );
    }
  };

  return{
    req:browserRequest,
    res:url=>url,
    play:async (url,title)=>{

        window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );
      }
    },
    pan:{
      check,
      play
    },
    check
  };

function hasTransportWrapper(result){
  if(
    !result||
    typeof result!=="object"
  ){
    return false;
  }

  return(
    Object.prototype.hasOwnProperty.call(
      result,
      "body"
    )||
    Object.prototype.hasOwnProperty.call(
      result,
      "text"
    )||
    Object.prototype.hasOwnProperty.call(
      result,
      "content"
    )||
    Object.prototype.hasOwnProperty.call(
      result,
      "status"
    )||
    Object.prototype.hasOwnProperty.call(
      result,
      "statusCode"
    )
  );
}

function responseBodyOf(result){
  if(result==null){
    return"";
  }

  if(typeof result==="string"){
    return result;
  }

  if(typeof result!=="object"){
    return String(result);
  }

  if(
    typeof result.body==="string"||
    (
      result.body&&
      typeof result.body==="object"
    )
  ){
    return result.body;
  }

  if(
    typeof result.text==="string"||
    (
      result.text&&
      typeof result.text==="object"
    )
  ){
    return result.text;
  }

  if(
    typeof result.content==="string"||
    (
      result.content&&
      typeof result.content==="object"
    )
  ){
    return result.content;
  }

  /*
    只有明确属于传输层包装时，
    才把 data 作为响应正文取出。

    普通业务 JSON 自身也可能存在 data，
    不能无条件删除外层结构。
  */
  if(
    hasTransportWrapper(result)&&
    (
      typeof result.data==="string"||
      (
        result.data&&
        typeof result.data==="object"
      )
    )
  ){
    return result.data;
  }

  return result;
}

function requestStatusOf(result){
  if(
    !result||
    typeof result!=="object"
  ){
    return 0;
  }

  const direct=Number(
    result.status||
    result.statusCode||
    0
  );

  if(direct){
    return direct;
  }

  if(
    hasTransportWrapper(result)&&
    Number(result.code)
  ){
    return Number(result.code);
  }

  return 0;
}

function requestErrorOf(result){
  if(
    !result||
    typeof result!=="object"||
    !result.error
  ){
    return"";
  }

  if(typeof result.error==="string"){
    return result.error;
  }

  try{
    return JSON.stringify(result.error);
  }catch(error){
    return String(result.error);
  }
}

async function requestRaw(url,opt={}){
  const options={
    method: opt.method||"GET",
    headers: opt.headers||{},
    body: opt.body===undefined ? "" : opt.body,
    responseType: opt.responseType||"text",
    timeout: opt.timeout||20
  };
  let result;
  try{
    result=await sdk().req(url, options); // 去掉 options.proxy
  }catch(error){
    throw Error(error?.message||String(error));
  }
  const errorText=requestErrorOf(result);
  if(errorText){ throw Error(errorText); }
  const status=requestStatusOf(result);
  if(status>=400){ throw Error("HTTP "+status); }
  return result;
}

async function requestText(url,opt={}){
  const result=await requestRaw(
    url,
    Object.assign({},opt,{
      responseType:"text"
    })
  );

  const body=
    responseBodyOf(result);

  if(typeof body==="string"){
    return body;
  }

  try{
    return JSON.stringify(body);
  }catch(error){
    return String(body||"");
  }
}

async function requestJson(url,opt={}){
  const result=await requestRaw(
    url,
    Object.assign({},opt,{
      responseType:"text"
    })
  );

  const body=
    responseBodyOf(result);

  if(
    body&&
    typeof body==="object"
  ){
    return body;
  }

  const text=String(
    body||
    ""
  ).trim();

  if(!text){
    throw Error("接口返回为空");
  }

  try{
    return JSON.parse(text);
  }catch(error){
    throw Error(
      "JSON解析失败："+
      text.slice(0,500)
    );
  }
}

/* 保留旧调用名称 */
async function nativeReqText(url,opt={}){
  return await requestText(
    url,
    opt
  );
}

async function nativeReqJson(url,opt={}){
  return await requestJson(
    url,
    opt
  );
}

/* =========================================================
   TMDB 图片通过 fm.res
   ========================================================= */

const RES_URL_CACHE=new Map();

function isTmdbImageUrl(url){
  try{
    const host=new URL(url)
      .hostname
      .toLowerCase();

    return(
      host==="images.tmdb.org"||
      host==="image.tmdb.org"||
      host.endsWith(".images.tmdb.org")
    );
  }catch(error){
    return false;
  }
}

function nativeResourceValue(result){
  if(typeof result==="string"){
    return result.trim();
  }

  if(
    !result||
    typeof result!=="object"
  ){
    return"";
  }

  const values=[
    result.url,
    result.data,
    result.body,
    result.src,
    result.value
  ];

  for(const value of values){
    if(
      typeof value==="string"&&
      value.trim()
    ){
      return value.trim();
    }
  }

  return"";
}

function resUrl(url){
  url=String(url||"").trim();
  if(!url){
    return"";
  }
  if(!isTmdbImageUrl(url)){
    return url;
  }
  if(RES_URL_CACHE.has(url)){
    return RES_URL_CACHE.get(url);
  }
  if(canNativeRes()){
    try{
      // 核心：像 YouTube 一样，交给 fm.res 生成本地网关地址
      const result=sdk().res(url,{
        headers:{
          "User-Agent":NATIVE_UA,
          Referer:TMDB_REFERER
        }
      });
      const output=nativeResourceValue(result);
      if(output){
        RES_URL_CACHE.set(url, output);
        return output;
      }
    }catch(error){
      console.warn("[fm.res failed]", url, error);
    }
  }
  RES_URL_CACHE.set(url, url);
  return url;
}

function rawImageUrl(path,size="w500"){
  if(!path){
    return"";
  }
  if(/^https?:\/\//i.test(path)){
    return path;
  }
  // 返回官方地址，resUrl 会把它变成 127.0.0.1 网关地址
  return TMDB_IMG_BASE + "/" + size + path;
}

function img(path,size="w500"){
  return resUrl(
    rawImageUrl(
      path,
      size
    )
  );
}

/* =========================================================
   图片预加载和背景切换
   ========================================================= */

function preload(url,timeout=120000){
  if(!url){
    return Promise.reject(
      Error("empty")
    );
  }

  const cached=
    S.bgCache.get(url);

  if(cached?.state==="loaded"){
    return Promise.resolve(url);
  }

  if(cached?.promise){
    return cached.promise;
  }

  const promise=new Promise(
    (resolve,reject)=>{
      const image=new Image();
      let completed=false;

      const timer=setTimeout(()=>{
        if(completed){
          return;
        }

        completed=true;
        image.onload=null;
        image.onerror=null;

        S.bgCache.set(url,{
          state:"error"
        });

        reject(
          Error("timeout")
        );
      },timeout);

      image.onload=()=>{
        if(completed){
          return;
        }

        completed=true;
        clearTimeout(timer);

        S.bgCache.set(url,{
          state:"loaded",
          image
        });

        resolve(url);
      };

      image.onerror=()=>{
        if(completed){
          return;
        }

        completed=true;
        clearTimeout(timer);

        S.bgCache.set(url,{
          state:"error"
        });

        reject(
          Error("error")
        );
      };

      image.src=url;
    }
  );

  S.bgCache.set(url,{
    state:"loading",
    promise
  });

  return promise;
}

function switchBg(
  stack,
  url,
  immediate=false,
  opt={}
){
  if(
    !stack||
    !url
  ){
    return;
  }

  stack._bgToken=
    (stack._bgToken||0)+1;

  const token=
    stack._bgToken;

  const layers=[
    ...stack.querySelectorAll(
      ".bg-layer"
    )
  ];

  const active=
    stack.querySelector(
      ".bg-layer.active"
    )||
    layers[0];

  const inactive=
    layers.find(
      layer=>layer!==active
    )||
    layers[1]||
    active;

  const useLoading=
    opt.loading===true;

  const apply=()=>{
    if(token!==stack._bgToken){
      return;
    }

    if(immediate){
      active.style.backgroundImage=
        'url("'+
        cssUrl(url)+
        '")';

      return;
    }

    inactive.style.backgroundImage=
      'url("'+
      cssUrl(url)+
      '")';

    requestAnimationFrame(()=>{
      if(token!==stack._bgToken){
        return;
      }

      inactive.classList.add("active");
      active.classList.remove("active");
    });
  };

  if(immediate){
    apply();
    preload(url).catch(()=>{});
    return;
  }

  if(useLoading){
    stack.classList.add("loading");
  }

  preload(url).then(()=>{
    if(useLoading){
      stack.classList.remove("loading");
    }

    apply();
  }).catch(()=>{
    if(useLoading){
      stack.classList.remove("loading");
    }
  });
}

function clearHeroBg(){
  const stack=$("heroBgStack");

  if(!stack){
    return;
  }

  stack._bgToken=
    (stack._bgToken||0)+1;

  stack.classList.remove("loading");

  stack
    .querySelectorAll(".bg-layer")
    .forEach((layer,index)=>{
      layer.style.backgroundImage="none";

      layer.classList.toggle(
        "active",
        index===0
      );
    });

  S.heroLastUrl="";
}

/* =========================================================
   TMDB API
   ========================================================= */

function tmdbHeaders(){
  const result={
    Accept:"application/json",
    "User-Agent":NATIVE_UA,
    Referer:TMDB_REFERER
  };

  if(TMDB_BEARER_TOKEN){
    result.Authorization=
      "Bearer "+
      TMDB_BEARER_TOKEN;
  }

  return result;
}

function apiUrl(path,params={}){
  const query=
    new URLSearchParams();

  query.set(
    "language",
    LANG
  );

  Object.keys(params).forEach(key=>{
    const value=params[key];

    if(
      value!==undefined&&
      value!==null&&
      value!==""
    ){
      query.set(
        key,
        String(value)
      );
    }
  });

  if(
    !TMDB_BEARER_TOKEN&&
    TMDB_API_KEY
  ){
    query.set(
      "api_key",
      TMDB_API_KEY
    );
  }

  return(
    TMDB_API_BASE+
    path+
    "?"+
    query.toString()
  );
}

async function tmdb(path,params){
  return await requestJson(
    apiUrl(path,params),
    {
      method:"GET",
      timeout:30,
      headers:tmdbHeaders() // 去掉 proxy: TMDB_PROXY
    }
  );
}

async function loadCat(category,page){
  const data=await tmdb(
    category.path,
    Object.assign(
      {},
      category.params,
      {
        page
      }
    )
  );

  return{
    list:
      (data.results||[])
        .map(norm)
        .filter(Boolean),

    page:Number(
      data.page||
      page
    ),

    total:Number(
      data.total_results||
      0
    ),

    pagecount:Number(
      data.total_pages||
      1
    )
  };
}

async function searchTmdb(query){
  const data=await tmdb(
    "/search/multi",
    {
      query,
      page:1,
      include_adult:"false"
    }
  );

  return(data.results||[])
    .map((item,index)=>{
      item.baseRank=index;
      return item;
    })
    .map(norm)
    .filter(Boolean)
    .sort((a,b)=>
      (
        b.voteAverage*1.2+
        b.popularity*.04
      )-
      (
        a.voteAverage*1.2+
        a.popularity*.04
      )
    );
}

async function fetchDetail(item){
  return await tmdb(

    }

async function fetchSeason(
  id,
  seasonNumber
){
  return await tmdb(
    "/tv/"+
    id+

  );
}

async function fetchPersonWorks(id){
  const data=await tmdb(
    "/person/"+
    id+
    "/combined_credits",
    {}
  );

  const seen={};
  const output=[];

  [
    ...(data.cast||[]),
    ...(data.crew||[])
  ].forEach(raw=>{
    const item=norm(raw);

    if(!item){
      return;
    }

    const key=
      item.mediaType+
      ":"+
      item.tmdbId;

    if(seen[key]){
      return;
    }

    seen[key]=1;
    output.push(item);
  });

  return output
    .sort((a,b)=>
      (
        b.voteAverage||
        0
      )-
      (
        a.voteAverage||
        0
      )
    )
    .slice(0,40);
}

/* =========================================================
   遥控器 Enter 短按和长按
   ========================================================= */

function bindRemotePress(element, onShort, onLong, opt={}){
  if(!element){ return null; }
  const delay=Number(opt.delay||700);
  let timer=0;
  let holding=false;
  let longTriggered=false;
  let suppressClickUntil=0;
  let keyDownHere=false; // 核心修复：标记位，判断是否在本元素上按下的键

  function clearTimer(){
    if(timer){ clearTimeout(timer); timer=0; }
  }
  function triggerLong(event){
    if(longTriggered){ return; }
    longTriggered=true;
    suppressClickUntil=Date.now()+1300;
    clearTimer();
    eat(event);
    if(typeof onLong==="function"){ onLong(event); }
  }
  element.addEventListener("keydown", event=>{
    if(keyOf(event)!=="Enter"){ return; }
    keyDownHere=true; // 记录：按键确实发生在我身上
    eat(event);
    if(!holding){
      holding=true;
      longTriggered=false;
      clearTimer();
      if(typeof onLong==="function"){
        timer=setTimeout(()=>{ triggerLong(event); },delay);
      }
    }
    if(event.repeat&&typeof onLong==="function"){ triggerLong(event); }
  }, true);
  
  element.addEventListener("keyup", event=>{
    if(keyOf(event)!=="Enter"){ return; }
    if(!keyDownHere){ return; } // 核心修复：如果是别处转移来的 keyup，直接丢弃！
    keyDownHere=false; // 消费掉标记
    eat(event);
    clearTimer();
    const wasLong=longTriggered;
    holding=false;
    suppressClickUntil=Date.now()+(wasLong?1300:500);
    if(!wasLong&&typeof onShort==="function"){
      onShort(event);
    }
    setTimeout(()=>{ longTriggered=false; },1400);
  }, true);
  
  element.addEventListener("click", event=>{
    if(longTriggered||Date.now()<suppressClickUntil){
      eat(event);
      return;
    }
    if(typeof onShort==="function"){ onShort(event); }
  }, true);
  
  return{
    cancel(){
      clearTimer();
      holding=false;
      longTriggered=false;
      suppressClickUntil=0;
      keyDownHere=false;
    }
  };
}

function heroItems(){
  return(S.items||[])
    .filter(item=>
      item&&
      (
        item.backdrop||
        item.poster
      )
    )
    .slice(0,10);
}

function heroItem(){
  const list=heroItems();

  if(!list.length){
    return null;
  }

  if(
    S.heroIndex<0||
    S.heroIndex>=list.length
  ){
    S.heroIndex=0;
  }

  return list[S.heroIndex];
}

function renderHero(immediate=true){
  const item=heroItem();
  const category=CATS[S.activeIndex];

  if(!item){
    $("heroFake").style.display="none";

    $("heroTitle").textContent=
      category?.name||
      "";

    $("heroBadge").textContent="";

    $("heroMeta").textContent=
      S.loading
        ?"正在加载..."
        :"";

    $("heroDots").replaceChildren();
    return;
  }

  $("heroFake").style.display="none";
  $("heroTitle").textContent=item.title;
  $("heroBadge").textContent="";

  $("heroMeta").textContent=[
    item.mediaType==="movie"
      ?"电影"
      :"剧集",

    item.year,

    item.voteAverage
      ?item.voteAverage.toFixed(1)+"分"
      :"",

    limit(
      item.desc,
      60
    )
  ].filter(Boolean).join(" · ");

  $("heroDots").replaceChildren(
    ...heroItems().map((_,index)=>{
      const dot=
        document.createElement("span");

      dot.className=
        "hero-dot"+
        (
          index===S.heroIndex
            ?" active"
            :""
        );

      return dot;
    })
  );

  const url=
    item.backdrop||
    item.posterBig||
    item.poster;

  if(
    url&&
    url!==S.heroLastUrl
  ){
    switchBg(
      $("heroBgStack"),
      url,
      immediate,
      {
        loading:false
      }
    );

    S.heroLastUrl=url;
  }
}

function showPreviousHero(){
  const list=heroItems();

  if(!list.length){
    return false;
  }

  if(S.heroIndex<=0){
    return false;
  }

  S.heroIndex--;
  renderHero(false);
  restartHeroAuto();

  return true;
}

function showNextHero(){
  const list=heroItems();

  if(!list.length){
    return false;
  }

  S.heroIndex=
    (
      S.heroIndex+1
    )%
    list.length;

  renderHero(false);
  restartHeroAuto();

  return true;
}

function restartHeroAuto(){
  clearTimeout(S.heroTimer);

  if(heroItems().length<=1){
    return;
  }

  S.heroTimer=setTimeout(async()=>{
    if(
      document.hidden||
      detailOpen()
    ){
      restartHeroAuto();
      return;
    }

    const list=heroItems();

    const nextIndex=
      (
        S.heroIndex+1
      )%
      list.length;

    const next=list[nextIndex];

    const url=
      next.backdrop||
      next.posterBig||
      next.poster;

    try{
      await preload(url);

      S.heroIndex=nextIndex;
      renderHero(false);
    }catch(error){}

    restartHeroAuto();
  },5200);
}

      nativeSearch(item);
    },
    {
      delay:700
    }
  );

  button.addEventListener(
    "focus",
    ()=>{
      if(button.closest("#vodGrid")){
        maybeAutoLoadByFocus(button);
      }
    }
  );

  return button;
}

}

function appendHomeGrid(list){

function updateHomeInfo(){

/* =========================================================
   首页自动分页
   ========================================================= */

function maybeAutoLoadByFocus(cardElement){
  if(
    !cardElement||
    S.loading||
    S.paging||
    S.page>=S.pagecount||
    detailOpen()||
    document.body.classList.contains(
      "search-open"
    )
  ){
    return;
  }

  const cards=[
    ...$("vodGrid")
      .querySelectorAll(".vod-card")
  ];

  const index=
    cards.indexOf(cardElement);

  if(index<0){
    return;
  }

  if(cards.length-index<=10){
    loadActive(
      S.page+1,
      true
    );
  }
}

function initAutoPaging(){
  if(S.pageObserver){
    S.pageObserver.disconnect();
  }

  if(
    typeof IntersectionObserver!=="function"
  ){
    return;
  }

  S.pageObserver=
    new IntersectionObserver(
      entries=>{
        const entry=entries[0];

        if(
          !entry||
          !entry.isIntersecting||
          S.loading||
          S.paging||
          S.page>=S.pagecount||
          detailOpen()||
          document.body.classList.contains(
            "search-open"
          )
        ){
          return;
        }

        loadActive(
          S.page+1,
          true
        );
      },
      {
        root:null,
        rootMargin:"500px 0px",
        threshold:.01
      }
    );

  S.pageObserver.observe(
    $("pageSentinel")
  );
}

/* =========================================================
   首页分类数据加载
   ========================================================= */

async function loadActive(
  page=1,
  append=false
){
  if(
    S.loading||
    (
      append&&
      S.paging
    )
  ){
    return false;
  }

  if(
    append&&
    page>S.pagecount
  ){
    updateHomeInfo();
    return false;
  }

  const token=
    S.categoryToken;

  S.loading=true;

  if(append){
    S.paging=true;
    updateHomeInfo();
  }else{
    renderGridInitial();
  }

  try{
    const data=await loadCat(
      CATS[S.activeIndex],
      page
    );

    if(token!==S.categoryToken){
      return false;
    }

    S.page=data.page;
    S.pagecount=data.pagecount;

    if(append){
      S.items.push(
        ...data.list
      );

      appendHomeGrid(
        data.list
      );
    }else{
      S.items=data.list;
      S.heroIndex=0;

      renderGridInitial();
      renderHero(false);
    }

    updateHomeInfo();
    restartHeroAuto();

    return data.list.length>0;
  }catch(error){
    if(token!==S.categoryToken){
      return false;
    }

    if(append){
      toast(
        "下一页加载失败："+error.message
      );
    }else{
      $("vodGrid").innerHTML=
        '<div class="empty" style="grid-column:1/-1">'+
        "TMDB加载失败："+esc(error.message)+
        "</div>";
    }

    return false;
  }finally{
    if(token===S.categoryToken){
      S.loading=false;
      S.paging=false;
      updateHomeInfo();
    }
  }
}

async function selectCategory(
  index,
  focusTab=false
){
  if(
    index<0||
    index>=CATS.length
  ){
    return false;
  }

  if(S.categorySwitching){
    return false;
  }

  S.categorySwitching=true;
  ++S.categoryToken;

  S.activeIndex=index;
  S.items=[];
  S.page=1;
  S.pagecount=1;
  S.heroIndex=0;
  S.heroLastUrl="";
  S.loading=false;
  S.paging=false;

  clearTimeout(S.heroTimer);
  clearHeroBg();

  renderTabs();
  renderCatPanel();
  renderHero(true);
  renderGridInitial();

  try{
    await loadActive(
      1,
      false
    );
  }finally{
    S.categorySwitching=false;
  }

  requestAnimationFrame(()=>{
    scrollTo(0,0);

    setTimeout(()=>{
      if(focusTab){
        const active=
          $("topTabs").querySelector(
            ".tab-btn.active"
          );

        focusEl(
          active||
          $("heroCard")
        );
      }else{
        focusHome(
          $("heroCard"),
          true
        );
      }
    },120);
  });

  return true;
}

function switchToNextCategory(){
  if(S.categorySwitching){
    return true;
  }

  const next=
    (
      S.activeIndex+1
    )%
    CATS.length;

  selectCategory(
    next,
    false
  );

  return true;
}

async function doSearch(){
  const query=clean(
    $("searchInput").value
  );

  if(!query){
    return;
  }

  const panel=$("searchPanel");

  panel.innerHTML=
    '<div class="empty">搜索中...</div>';

  try{
    const list=await searchTmdb(
      query
    );

    panel.replaceChildren();

    if(!list.length){
      panel.innerHTML=
        '<div class="empty">无结果</div>';

      return;
    }

    list.forEach(item=>{
      const button=
        document.createElement("button");

      button.className=
        "search-item rainbow-focus fill-focus focusable";

      button.innerHTML=
        (
          item.poster
            ?(
              '<img src="'+
              esc(item.poster)+
              '">'
            )
            :"<span></span>"
        )+
        "<div>"+
          '<div class="search-title">'+
            esc(item.title)+
          "</div>"+
          '<div class="search-meta">'+
            esc(
              [
                item.year,

                item.mediaType==="movie"
                  ?"电影"
                  :"剧集",

                item.voteAverage
                  ?item.voteAverage.toFixed(1)+"分"
                  :""
              ].filter(Boolean).join(" · ")
            )+
          "</div>"+
        "</div>";

      button.onclick=()=>{
        closeSearchRestore();
        openDetail(item);
      };

      panel.appendChild(button);
    });

    focusEl(
      panel.querySelector(
        ".search-item"
      )
    );
  }catch(error){
    panel.innerHTML=
      '<div class="empty">'+
      "搜索失败："+esc(error.message)+
      "</div>";
  }
}

function saveHome(){
  S.savedX=scrollX;
  S.savedY=scrollY;
  S.savedFocus=document.activeElement;

  S.savedCard=[
    ...document.querySelectorAll(
      "#vodGrid .vod-card"

function restoreHome(){

      "#vodGrid .vod-card"

  const target=
    S.savedFocus?.isConnected
      ?S.savedFocus

  requestAnimationFrame(()=>{

/* =========================================================
   详情标题、元数据和背景
   ========================================================= */

/*
  盘搜关键字只使用中文显示名。

  不再把英文原名拼接到关键字中，
  避免 PanSou 因中英文混合导致结果过少。
*/
function titleVariants(item,detail){
  const main=clean(
    detail?.title||
    detail?.name||
    item?.title||
    "详情"
  );

  return{
    main,
    variant:"",
    keyword:main
  };
}

function pickTitleLogo(detail){
  const logos=
    detail?.images?.logos||
    [];

  if(
    !Array.isArray(logos)||
    !logos.length
  ){
    return"";
  }

  const chinese=logos.find(item=>
    item.iso_639_1==="zh"&&
    item.file_path
  );

  const neutral=logos.find(item=>
    (
      item.iso_639_1==null||
      item.iso_639_1===""
    )&&
    item.file_path
  );

  const english=logos.find(item=>
    item.iso_639_1==="en"&&
    item.file_path
  );

  const any=logos.find(item=>
    item.file_path
  );

  return img(
    (
      chinese||
      neutral||
      english||
      any
    )?.file_path,
    "w500"
  );
}

function setDetailTitle(item,detail){
  const variants=titleVariants(
    item,
    detail
  );

  $("detailTitleMain").textContent=
    variants.main;

  $("detailTitleVariant").textContent="";

  const logo=$("detailTitleLogo");
  const row=$("detailTitleRow");

  const url=
    detail
      ?pickTitleLogo(detail)
      :"";

  if(url){
    logo.src=url;
    row.classList.add("has-logo");
  }else{
    logo.removeAttribute("src");
    row.classList.remove("has-logo");
  }
}

function setMeta(item,detail){
  const year=
    yearOf({
      release_date:
        detail?.release_date,

      first_air_date:
        detail?.first_air_date
    })||
    item.year;

  const runtime=
    detail&&(
      detail.runtime||
      (
        detail.episode_run_time&&
        detail.episode_run_time[0]
      )
    );

  const genres=
    detail?.genres
      ?(
        detail.genres||
        []
      )
        .map(genre=>genre.name)
        .join(" / ")
      :"";

  const rating=Number(
    detail?.vote_average||
    item.voteAverage||
    0
  );

  $("detailMeta").textContent=[
    year,

    item.mediaType==="movie"
      ?"电影"
      :"剧集",

    rating
      ?rating.toFixed(1)+"分"
      :"",

    runtime
      ?runtime+"分钟"
      :"",

    genres,

    "TMDB "+item.tmdbId
  ].filter(Boolean).join(" · ");
}

function clearDetailBgAuto(){
  clearTimeout(
    S.detailBgTimer
  );

  S.detailBgTimer=0;
}

function buildDetailBgList(item,detail){
  const list=[
    img(
      detail?.backdrop_path||
      item?.backdropPath,
      "original"
    ),

    item?.backdrop,
    item?.posterBig,

    ...(
      detail?.images?.backdrops||
      []
    ).map(image=>
      img(
        image.file_path,
        "original"
      )
    )
  ].filter(Boolean);

  const seen={};

  S.detailBgList=list.filter(url=>
    !seen[url]&&
    (
      seen[url]=1
    )
  );

  S.detailBgIndex=0;
}

function startDetailBgAuto(){
  clearDetailBgAuto();

  if(
    !detailOpen()||
    S.detailBgList.length<=1
  ){
    return;
  }

  S.detailBgTimer=setTimeout(()=>{
    if(!detailOpen()){
      return;
    }

    S.detailBgIndex=
      (
        S.detailBgIndex+1
      )%
      S.detailBgList.length;

    switchBg(
      $("detailBgStack"),
      S.detailBgList[
        S.detailBgIndex
      ],
      false,
      {
        loading:false
      }
    );

    startDetailBgAuto();
  },6000);
}

function collectCoverPreload(item,detail){
  const list=[
    item.backdrop,
    item.posterBig,

    img(
      detail.backdrop_path,
      "original"
    ),

    img(
      detail.poster_path,
      "original"
    ),

    ...(
      detail.images?.backdrops||
      []
    )
      .slice(0,8)
      .map(image=>
        img(
          image.file_path,
          "original"
        )
      ),

    ...(
      detail.images?.posters||
      []
    )
      .slice(0,4)
      .map(image=>
        img(
          image.file_path,
          "w780"
        )
      ),

    ...(
      detail.images?.logos||
      []
    )
      .slice(0,4)
      .map(image=>
        img(
          image.file_path,
          "w500"
        )
      )
  ].filter(Boolean);

  const seen={};

  list
    .filter(url=>
      !seen[url]&&
      (
        seen[url]=1
      )
    )
    .slice(0,12)
    .forEach(url=>{
      preload(url).catch(()=>{});
    });
}

function resetDetail(){

  ].forEach(id=>{

async function openDetail(item){
  if(!item){
    return;
  }

  if(!detailOpen()){
    saveHome();
  }

  pushDetailHistory();

  S.currentItem=item;
  S.detail=null;
  S.detailTab="info";
  S.seasonCache={};

  const token=
    ++S.detailToken;

  $("detail").classList.add(
    "active"
  );

  $("detail").classList.remove(
    "second-open"
  );

  $("detail").scrollTop=0;

  resetDetail();
  buildTabs();
  selectTab("info",false);

  setDetailTitle(
    item,
    null
  );

  setMeta(
    item,
    null
  );

  $("detailDesc").textContent=
    limit(
      item.desc||
      "暂无简介",
      60
    );

  const background=
    item.backdrop||
    item.posterBig||
    item.poster;

  switchBg(
    $("detailBgStack"),
    background,
    true,
    {
      loading:false
    }
  );

  setTimeout(()=>{
    focusEl(
      $("detailPanBtn")
    );
  },40);

  try{
    const detail=await fetchDetail(
      item
    );

    if(
      token!==S.detailToken||
      !detailOpen()
    ){
      return;
    }

    S.detail=detail;

    setDetailTitle(
      item,
      detail
    );

    setMeta(
      item,
      detail
    );

    $("detailDesc").textContent=
      limit(
        detail.overview||
        item.desc||
        "暂无简介",
        60
      );

    const nextBackground=img(
      detail.backdrop_path||
      item.backdropPath||
      detail.poster_path||
      item.posterPath,
      "original"
    );

    if(
      nextBackground&&
      nextBackground!==background
    ){
      switchBg(
        $("detailBgStack"),
        nextBackground,
        false,
        {
          loading:false
        }
      );
    }

    collectCoverPreload(
      item,
      detail
    );

    buildDetailBgList(
      item,
      detail
    );

    startDetailBgAuto();
    renderInfo();
    renderEpisodes();
    renderRecommend();
    renderStills();

    $("detail").scrollTop=0;

    focusEl(
      $("detailPanBtn")
    );
  }catch(error){
    console.warn(
      "[TMDB detail failed]",
      error
    );

    renderInfo();
  }
}

function finishCloseDetail(){
  ++S.detailToken;
  ++S.playToken;

  clearPanPolling();
  clearDetailBgAuto();

  S.detailBgList=[];
  S.detailBgIndex=0;
  S.playOpening=false;

  $("detail").classList.remove(
    "active",
    "pan-open",
    "second-open"
  );

  $("detail").scrollTop=0;

  S.currentItem=null;
  S.detail=null;
  S.detailTab="info";
  S.detailHistory=false;

  S.detailFirstReturn=null;
  S.detailFirstReturnKey="";
  S.detailFirstReturnType="";
  S.detailFirstReturnIndex=-1;

  restoreHome();
}

/* =========================================================
   PanSou 基础工具
   ========================================================= */

function panApi(path){
  return(
    PAN_API_BASE||
    ""
  )+path;
}

/*
  GET /api/search 使用查询参数。

  默认仅提交关键词及 merge/all，
  不主动限制 channels、plugins、cloud_types。
*/
function panSearchParams(keyword){
  const params={
    kw:keyword,
    res:"merge",
    src:
      PAN_SEARCH_OPTIONS.src||
      "all"
  };

  if(PAN_SEARCH_OPTIONS.channels?.length){
    params.channels=
      PAN_SEARCH_OPTIONS.channels.join(",");
  }

  if(PAN_SEARCH_OPTIONS.plugins?.length){
    params.plugins=
      PAN_SEARCH_OPTIONS.plugins.join(",");
  }

  if(PAN_SEARCH_OPTIONS.cloudTypes?.length){
    params.cloud_types=
      PAN_SEARCH_OPTIONS.cloudTypes.join(",");
  }

  return params;
}

function panPayload(keyword){
  const payload={
    kw:keyword,
    res:"merge",
    src:
      PAN_SEARCH_OPTIONS.src||
      "all"
  };

  if(PAN_SEARCH_OPTIONS.channels?.length){
    payload.channels=[
      ...PAN_SEARCH_OPTIONS.channels
    ];
  }

  if(PAN_SEARCH_OPTIONS.plugins?.length){
    payload.plugins=[
      ...PAN_SEARCH_OPTIONS.plugins
    ];
  }

  if(PAN_SEARCH_OPTIONS.cloudTypes?.length){
    payload.cloud_types=[
      ...PAN_SEARCH_OPTIONS.cloudTypes
    ];
  }

  return payload;
}

async function postJson(
  url,
  body,
  timeout=28,
  requestHeaders={}
){
  return await requestJson(
    url,
    {
      method:"POST",

      headers:Object.assign(
        {
          "Content-Type":
            "application/json",

          Accept:
            "application/json"
        },
        requestHeaders
      ),

      body:JSON.stringify(body),
      timeout
    }
  );
}

/*
  优先使用 PanSou 标准 GET /api/search。

  只有 GET 请求失败时才使用 POST 兼容旧服务，
  防止同一次轮询重复提交两次搜索任务。
*/
async function requestPanSearch(keyword){
  const getUrl=
    panApi("/api/search")+
    "?"+
    new URLSearchParams(
      panSearchParams(keyword)
    ).toString();

  try{
    return await requestJson(
      getUrl,
      {
        method:"GET",
        timeout:PAN_SEARCH_TIMEOUT,
        headers:{
          Accept:"application/json"
        }
      }
    );
  }catch(getError){
    console.warn(
      "[PanSou GET search failed, fallback POST]",
      getError
    );

    return await postJson(
      panApi("/api/search"),
      panPayload(keyword),
      PAN_SEARCH_TIMEOUT
    );
  }
}

function diskName(type){
  return{
    baidu:"百度",
    quark:"夸克",
    "115":"115",
    magnet:"磁力",
    uc:"UC",
    aliyun:"阿里",
    "123":"123",
    pikpak:"PikPak",
    xunlei:"迅雷",
    mobile:"移动",
    tianyi:"天翼",
    ed2k:"电驴",
    other:"其他"
  }[type]||type;
}

function normDisk(value){
  value=String(
    value||
    ""
  ).toLowerCase();

  if(
    value.includes("baidu")||
    value.includes("百度")
  ){
    return"baidu";
  }

  if(
    value.includes("quark")||
    value.includes("夸克")
  ){
    return"quark";
  }

  if(value.includes("115")){
    return"115";
  }

  if(
    value.includes("magnet")||
    value.includes("磁力")||
    value==="bt"
  ){
    return"magnet";
  }

  if(value.includes("uc")){
    return"uc";
  }

  if(
    value.includes("ali")||
    value.includes("阿里")
  ){
    return"aliyun";
  }

  if(value.includes("123")){
    return"123";
  }

  if(value.includes("pikpak")){
    return"pikpak";
  }

  if(
    value.includes("xunlei")||
    value.includes("迅雷")
  ){
    return"xunlei";
  }

  if(
    value.includes("mobile")||
    value.includes("移动")
  ){
    return"mobile";
  }

  if(
    value.includes("tianyi")||
    value.includes("天翼")
  ){
    return"tianyi";
  }

  if(value.includes("ed2k")){
    return"ed2k";
  }

  return value||"other";
}

/*
  资源去重必须使用完整 URL。

  不再删除查询参数、提取码或尾部路径，
  避免把不同分享资源错误合并。
*/
function normUrl(url){
  return String(
    url||
    ""
  ).trim();
}

function firstNonEmptyText(values){
  for(const value of values){
    if(
      typeof value==="string"&&
      value.trim()
    ){
      return value.trim();
    }
  }

  return"";
}

/*
  百度部分插件会返回：

  url:[
    "展示页",
    "实际分享链接"
  ]

  此时优先使用第二项。
*/
function panRawUrl(raw,type){
  const values=[
    raw?.url,
    raw?.link,
    raw?.share_url,
    raw?.shareUrl,
    raw?.href
  ];

  for(const value of values){
    if(Array.isArray(value)){
      const list=value
        .map(item=>
          typeof item==="string"
            ?item.trim()
            :""
        )
        .filter(Boolean);

      if(
        type==="baidu"&&
        list[1]
      ){
        return list[1];
      }

      if(list[0]){
        return list[0];
      }

      continue;
    }

    if(
      typeof value==="string"&&
      value.trim()
    ){
      return value.trim();
    }
  }

  return"";
}

function qualityScore(item){
  const text=[
    item.note,
    item.title,
    item.url,
    item.source
  ]
    .map(value=>
      String(value||"")
    )
    .join(" ");

  const lower=
    text.toLowerCase();

  let score=0;

  if(
    text.includes("杜比")||
    lower.includes("dolby")||
    lower.includes("dovi")||
    /\bdv\b/i.test(text)
  ){
    score+=120000;
  }

  if(
    text.includes("双语")||
    lower.includes("老k")||
    lower.includes("年糕")
  ){
    score+=100000;
  }

  if(lower.includes("hdr10+")){
    score+=85000;
  }else if(lower.includes("hdr10")){
    score+=80000;
  }else if(lower.includes("hdr")){
    score+=75000;
  }

  if(
    lower.includes("8k")||
    lower.includes("4320p")
  ){
    score+=76000;
  }

  if(
    lower.includes("4k")||
    lower.includes("2160p")||
    lower.includes("2160")||
    lower.includes("uhd")
  ){
    score+=65000;
  }

  if(
    text.includes("原盘")||
    lower.includes("remux")||
    lower.includes("bluray")||
    lower.includes("blu-ray")
  ){
    score+=55000;
  }

  if(
    lower.includes("60fps")||
    text.includes("60帧")
  ){
    score+=35000;
  }

  if(
    lower.includes("全集")||
    lower.includes("完结")
  ){
    score+=20000;
  }

  if(
    lower.includes("1080p")||
    lower.includes("1080")
  ){
    score+=15000;
  }

  if(
    lower.includes("720p")||
    lower.includes("720")
  ){
    score+=5000;
  }

  if(
    [
      "枪版",
      "抢先",
      "预告",
      "花絮",
      "解说"
    ].some(keyword=>
      text.includes(keyword)
    )
  ){
    score-=1000000;
  }

  return score;
}

function dateTimestamp(value){
  if(
    typeof value==="number"&&
    Number.isFinite(value)
  ){
    return value;
  }

  const text=clean(value);

  if(!text){
    return 0;
  }

  const numeric=Number(text);

  if(
    Number.isFinite(numeric)&&
    numeric>0
  ){
    return numeric;
  }

  const parsed=Date.parse(text);

  return Number.isFinite(parsed)
    ?parsed
    :0;
}

function panSourceRoot(body){
  return(
    body?.data?.merged_by_type||
    body?.merged_by_type||
    body?.data?.results||
    body?.results||
    body?.data||
    body||
    {}
  );
}

function normalizePanBody(body){
  let root=
    panSourceRoot(body);

  const output=[];
  let index=0;

  if(Array.isArray(root)){
    root={
      other:root
    };
  }

  if(
    !root||
    typeof root!=="object"
  ){
    return output;
  }

  Object.keys(root).forEach(key=>{
    const type=
      normDisk(key);

    const container=
      root[key];

    const source=
      Array.isArray(container)
        ?container
        :(
          container?.items||
          container?.list||
          container?.results||
          container?.data||
          []
        );

    if(!Array.isArray(source)){
      return;
    }

    source.forEach(raw=>{
      if(
        !raw||
        typeof raw!=="object"
      ){
        return;
      }

      const url=
        panRawUrl(
          raw,
          type
        );

      const title=
        firstNonEmptyText([
          raw.title,
          raw.name,
          raw.file_name,
          raw.filename,
          raw.note,
          url
        ]);

      if(
        !url&&
        !title
      ){
        return;
      }

      const password=
        firstNonEmptyText([
          raw.password,
          raw.pwd,
          raw.code,
          raw.passcode,
          raw.extract_code,
          raw.extractCode
        ]);

      const datetime=
        firstNonEmptyText([
          raw.datetime,
          raw.time,
          raw.date,
          raw.created_at,
          raw.updated_at
        ]);

      const timestamp=
        Number(
          raw._timestamp||
          raw.timestamp||
          raw.ts||
          0
        )||
        dateTimestamp(datetime);

      const item={
        diskType:type,
        diskName:diskName(type),

        url,

        password,

        title:clean(title),

        note:clean(
          raw.note||
          title
        ),

        source:
          raw.source||
          raw.channel||
          raw.plugin||
          "",

        datetime,
        timestamp,

        normalizedUrl:
          normUrl(url),

        index:index++,
        raw
      };

      item.score=
        qualityScore(item);

      /*
        完整 URL 参与去重。

        diskType 保留在 key 中，避免不同网盘恰好返回
        相同文本时互相覆盖。
      */
      item.key=
        item.diskType+
        "|"+
        item.normalizedUrl;

      output.push(item);
    });
  });

  return output;
}

function mergePan(items){
  items.forEach(item=>{
    if(
      !item.key||
      !item.url
    ){
      return;
    }

    if(S.pan.map.has(item.key)){
      const old=
        S.pan.map.get(item.key);

      /*
        已经使用盘检结果修正过 normalized_url 时，
        轮询合并不能用旧搜索链接覆盖它。
      */
      const health=
        S.pan.health.get(item.key);

      const keepUrl=
        health?.normalizedUrl||
        old?.checkedNormalizedUrl||
        "";

      const merged=Object.assign(
        {},
        old,
        item
      );

      if(keepUrl){
        merged.url=keepUrl;
        merged.normalizedUrl=keepUrl;
        merged.checkedNormalizedUrl=keepUrl;
      }

      merged.key=item.key;

      S.pan.map.set(
        item.key,
        merged
      );
    }else{
      S.pan.map.set(
        item.key,
        item
      );
    }
  });

  buildPanGroups();
}

function getHealth(item){
  return S.pan.health.get(
    item.key
  )||{
    state:"idle"
  };
}

function cssEscape(value){
  if(
    window.CSS&&
    typeof CSS.escape==="function"
  ){
    return CSS.escape(value);
  }

  return String(value)
    .replace(
      /["\\]/g,
      "\\$&"
    );
}

function buildPanGroups(){
  const groups={};

  [
    ...S.pan.map.values()
  ].forEach(item=>{
    const health=
      getHealth(item);

    /*
      仅明确 bad 的资源隐藏。

      locked、uncertain、unsupported、pending
      均继续保留并允许用户打开。
    */
    if(health.state==="bad"){
      return;
    }

    (
      groups[item.diskType]||
      (
        groups[item.diskType]=[]
      )
    ).push(item);
  });

  Object.keys(groups).forEach(type=>{
    groups[type]=groups[type]
      .map((item,index)=>({
        item,
        index
      }))
      .sort((a,b)=>
        (
          b.item.score||
          0
        )-
        (
          a.item.score||
          0
        )||

        (
          b.item.timestamp||
          0
        )-
        (
          a.item.timestamp||
          0
        )||

        String(
          a.item.note||
          a.item.title||
          ""
        ).localeCompare(
          String(
            b.item.note||
            b.item.title||
            ""
          ),
          "zh-Hans-CN"
        )||

        a.item.index-
        b.item.index||

        a.index-
        b.index
      )
      .map(entry=>entry.item);
  });

  S.pan.groups=groups;

  if(
    !S.pan.type||
    !groups[S.pan.type]
  ){
    S.pan.type=
      PAN_TYPE_ORDER.find(
        type=>
          groups[type]?.length
      )||
      Object.keys(groups)[0]||
      "";
  }
}

/* =========================================================
   盘搜列表焦点和滚动状态
   ========================================================= */

function allPanItems(){
  return[
    ...$("panResults")
      .querySelectorAll(".pan-item")
  ].filter(item=>
    !item.disabled
  );
}

function capturePanViewState(){
  const root=$("panResults");
  const active=document.activeElement;

  return{
    key:
      active?.closest?.("#panResults")
        ?(
          active.dataset.key||
          ""
        )
        :(
          S.pan.focusKey||
          ""
        ),

    type:
      active?.closest?.("#panTypes")
        ?(
          active.dataset.type||
          ""
        )
        :(
          S.pan.type||
          ""
        ),

    index:
      active?.closest?.("#panResults")
        ?allPanItems().indexOf(active)
        :S.pan.focusIndex,

    scrollTop:
      root.scrollTop,

    wasResultFocused:
      Boolean(
        active?.closest?.("#panResults")
      ),

    wasTypeFocused:
      Boolean(
        active?.closest?.("#panTypes")
      )
  };
}

function savePanViewState(){
  const root=$("panResults");
  const active=document.activeElement;

  S.pan.scrollTop=
    root.scrollTop;

  S.pan.focusType=
    S.pan.type||
    "";

  if(active?.closest?.("#panResults")){
    const items=allPanItems();

    S.pan.focusKey=
      active.dataset.key||
      "";

    S.pan.focusIndex=
      items.indexOf(active);
  }else if(active?.closest?.("#panTypes")){
    S.pan.focusType=
      active.dataset.type||
      S.pan.type||
      "";
  }
}

/*
  此函数只负责滚动，不再调用 focus()。

  焦点变更与滚动彻底分离，
  避免 focusin 中再次 focus 导致电视 WebView
  出现重复聚焦或跳回第一条。
*/
function ensurePanItemVisible(item){
  if(!item){
    return false;
  }

  const root=$("panResults");

  const itemTop=
    item.offsetTop;

  const itemBottom=
    itemTop+
    item.offsetHeight;

  const viewTop=
    root.scrollTop;

  const viewBottom=
    viewTop+
    root.clientHeight;

  if(itemTop<viewTop){
    root.scrollTop=
      Math.max(
        0,
        itemTop-4
      );
  }else if(itemBottom>viewBottom){
    root.scrollTop=
      Math.max(
        0,
        itemBottom-
        root.clientHeight+
        4
      );
  }

  S.pan.scrollTop=
    root.scrollTop;

  return true;
}

function focusPanItem(item){
  if(!item){
    return false;
  }

  focusEl(item);
  ensurePanItemVisible(item);

  return true;
}

function restorePanViewState(previous={}){
  const root=$("panResults");

  const savedKey=
    previous.key||
    S.pan.focusKey||
    "";

  const savedIndex=
    Number.isInteger(
      previous.index
    )
      ?previous.index
      :S.pan.focusIndex;

  const savedScrollTop=
    Number.isFinite(
      previous.scrollTop
    )
      ?previous.scrollTop
      :S.pan.scrollTop;

  root.scrollTop=
    Math.max(
      0,
      Number(
        savedScrollTop||
        0
      )
    );

  S.pan.scrollTop=
    root.scrollTop;

  if(previous.wasResultFocused===true){
    const items=allPanItems();
    let target=null;

    if(savedKey){
      target=root.querySelector(
        '[data-key="'+
        cssEscape(savedKey)+
        '"]'
      );
    }

    if(
      !target&&
      items.length
    ){
      const index=Math.max(
        0,
        Math.min(
          Number.isFinite(savedIndex)
            ?savedIndex
            :0,
          items.length-1
        )
      );

      target=items[index];
    }

    if(target){
      requestAnimationFrame(()=>{
        focusPanItem(target);
      });

      return;
    }

    requestAnimationFrame(()=>{
      focusEl(
        activePanType()||
        $("detailPanBtn")
      );
    });

    return;
  }

  if(previous.wasTypeFocused===true){
    const target=
      $("panTypes").querySelector(
        '[data-type="'+
        cssEscape(
          previous.type||
          S.pan.type
        )+
        '"]'
      );

    if(target){
      requestAnimationFrame(()=>{
        focusEl(target);
      });
    }
  }
}

/* =========================================================
   盘搜状态显示
   ========================================================= */

function panHealthClass(state){
  if(state==="pending"){
    return"checking";
  }

  if(
    state==="ok"||
    state==="locked"||
    state==="uncertain"||
    state==="unsupported"||
    state==="bad"
  ){
    return state;
  }

  return"";
}

function panHealthTitle(state){
  return{
    pending:"检测中",
    ok:"有效",
    locked:"需要提取码或登录",
    uncertain:"状态不确定",
    unsupported:"暂不支持检测",
    bad:"失效"
  }[state]||"";
}

/* =========================================================
   盘搜渲染
   ========================================================= */

function renderPan(){
  const typeRoot=$("panTypes");
  const resultRoot=$("panResults");

  const previous=
    capturePanViewState();

  savePanViewState();

  typeRoot.replaceChildren();
  resultRoot.replaceChildren();

  const types=
    PAN_TYPE_ORDER
      .filter(type=>
        S.pan.groups[type]?.length
      )
      .concat(
        Object.keys(S.pan.groups)
          .filter(type=>
            !PAN_TYPE_ORDER.includes(type)&&
            S.pan.groups[type]?.length
          )
      );

  if(
    S.pan.loading&&
    !types.length
  ){
    resultRoot.innerHTML=
      '<div class="empty" style="min-height:80px">'+
      "盘搜中..."+
      "</div>";

    return;
  }

  if(!types.length){
    resultRoot.innerHTML=
      '<div class="empty" style="min-height:80px">'+
      "暂无盘搜结果"+
      "</div>";

    return;
  }

  types.forEach(type=>{
    const button=
      document.createElement("button");

    button.className=
      "pan-type rainbow-focus fill-focus focusable"+
      (
        type===S.pan.type
          ?" current"
          :""
      );

    button.dataset.type=type;

    button.textContent=
      diskName(type)+
      " "+
      S.pan.groups[type].length;

    button.onclick=()=>{
      savePanViewState();

      S.pan.type=type;
      S.pan.focusType=type;
      S.pan.focusKey="";
      S.pan.focusIndex=-1;
      S.pan.scrollTop=0;

      renderPan();

      setTimeout(()=>{
        focusEl(
          $("panTypes").querySelector(
            '[data-type="'+
            cssEscape(type)+
            '"]'
          )
        );
      },20);
    };

    typeRoot.appendChild(button);
  });

  const list=
    S.pan.groups[S.pan.type]||
    [];

  list.forEach((item,index)=>{
    const health=
      getHealth(item);

    const button=
      document.createElement("button");

    button.className=
      "pan-item rainbow-focus fill-focus focusable";

    button.dataset.key=item.key;
    button.dataset.index=index;

    const dotClass=
      panHealthClass(
        health.state
      );

    button.title=
      panHealthTitle(
        health.state
      );

    button.innerHTML=
      '<span class="pan-dot '+
      esc(dotClass)+
      '"></span>'+
      "<span>"+
        '<div class="pan-item-title">'+
          esc(
            item.title||
            item.note||
            "资源"
          )+
        "</div>"+
      "</span>";

    button.onclick=()=>{
      S.pan.focusKey=item.key;
      S.pan.focusIndex=index;
      S.pan.focusType=S.pan.type;
      S.pan.scrollTop=resultRoot.scrollTop;

      openPanItem(
        item,
        button
      );
    };

    button.addEventListener(
      "focus",
      ()=>{
        S.pan.focusKey=item.key;
        S.pan.focusIndex=index;
        S.pan.focusType=S.pan.type;
        S.pan.scrollTop=resultRoot.scrollTop;

        ensurePanItemVisible(button);
      }
    );

    resultRoot.appendChild(button);
  });

  restorePanViewState(
    previous
  );
}

/* =========================================================
   盘搜打开、关闭和搜索

function openPan(openFocus=true){
  $("detail").classList.remove(
    "second-open"
  );

  $("detail").classList.add(
    "pan-open"
  );

  S.pan.open=true;

  renderPan();

  if(openFocus){
    setTimeout(()=>{
      const remembered=
        S.pan.focusKey
          ?$("panResults").querySelector(
            '[data-key="'+
            cssEscape(
              S.pan.focusKey
            )+
            '"]'
          )
          :null;

      if(remembered){
        focusPanItem(
          remembered
        );

        return;
      }

      focusEl(
        $("panTypes").querySelector(
          ".pan-type.current"
        )||
        $("panTypes").querySelector(
          ".pan-type"
        )||
        $("panResults").querySelector(
          ".pan-item"
        )||
        $("detailPanBtn")
      );
    },30);
