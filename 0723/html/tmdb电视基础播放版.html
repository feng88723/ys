}

function closePan(render=true){
  $("detail").classList.remove(
    "pan-open"
  );

  S.pan.open=false;
  S.pan.loading=false;
  S.pan.checking=false;

  clearPanPolling();

  if(render){
    $("panTypes").replaceChildren();
    $("panResults").replaceChildren();
  }
}

async function startPanSearch(){
  const item=S.currentItem;

  if(!item){
    return;
  }

  const variants=titleVariants(
    item,
    S.detail
  );

  const keyword=clean(
    variants.keyword||
    item.title
  );

  const oldToken=Number(
    S.pan.token||
    0
  );

  const oldCheckToken=Number(
    S.pan.checkToken||
    0
  );

  S.pan={
    open:true,
    keyword,
    map:new Map(),
    groups:{},
    type:"",
    health:new Map(),
    pollTimers:[],
    token:oldToken+1,
    loading:true,
    checking:false,
    checkToken:oldCheckToken+1,

    focusKey:"",
    focusType:"",
    focusIndex:-1,
    scrollTop:0
  };

  openPan(true);

  const token=S.pan.token;

  try{
    const body=await requestPanSearch(
      keyword
    );

    if(token!==S.pan.token){
      return;
    }

    mergePan(
      normalizePanBody(body)
    );

    S.pan.loading=false;

    renderPan();

    /*
      搜索首批结果渲染完成后批量盘检，
      不在滚动过程中逐条检查。
    */
    schedulePanBatchCheck(
      token,
      100
    );

    schedulePanPolling(token);
  }catch(error){
    if(token!==S.pan.token){
      return;
    }

    S.pan.loading=false;

    renderPan();

    toast(
      "盘搜失败："+error.message
    );
  }
}

function clearPanPolling(){
  (
    S.pan.pollTimers||
    []
  ).forEach(timer=>{
    clearTimeout(timer);
  });

  S.pan.pollTimers=[];
}

function schedulePanPolling(token){
  clearPanPolling();

  PAN_SEARCH_POLL_INTERVALS.forEach(delay=>{
    const timer=setTimeout(async()=>{
      if(
        token!==S.pan.token||
        !detailOpen()||
        !S.pan.open
      ){
        return;
      }

      try{
        const body=await requestPanSearch(
          S.pan.keyword
        );

        if(token!==S.pan.token){
          return;
        }

        mergePan(
          normalizePanBody(body)
        );

        renderPan();

        /*
          每次增量结果合并后再做一次批量盘检。
          已有最终状态的链接不会重复检查。
        */
        schedulePanBatchCheck(
          token,
          120
        );
      }catch(error){
        console.warn(
          "[PanSou polling failed]",
          error
        );
      }
    },delay);

    S.pan.pollTimers.push(timer);
  });
}

/* =========================================================
   盘搜批量链接健康检查
   ========================================================= */

function checkablePanItems(){
  const output=[];

  PAN_CHECK_TYPES.forEach(type=>{
    (
      S.pan.groups[type]||
      []
    )
      .slice(0,PAN_CHECK_LIMIT)
      .forEach(item=>{
        const state=
          S.pan.health.get(
            item.key
          )?.state;

        if(
          state==="ok"||
          state==="locked"||
          state==="bad"||
          state==="unsupported"
        ){
          return;
        }

        output.push(item);
      });
  });

  return output;
}

function schedulePanBatchCheck(
  panToken,
  delay=100
){
  clearTimeout(
    S.pan._checkTimer
  );

  S.pan._checkTimer=setTimeout(()=>{
    runPanBatchCheck(
      panToken
    ).catch(error=>{
      console.warn(
        "[PanSou batch check failed]",
        error
      );
    });
  },delay);
}

function checkStateOf(result){
  const raw=clean(
    result?.state||
    result?.status||
    result?.result||
    result?.code||
    ""
  ).toLowerCase();

  if(
    result?.ok===true||
    result?.valid===true||
    [
      "ok",
      "valid",
      "alive",
      "success",
      "available",
      "1",
      "200"
    ].includes(raw)
  ){
    return"ok";
  }

  if(
    result?.locked===true||
    result?.need_password===true||
    result?.needPassword===true||
    [
      "locked",
      "password",
      "need_password",
      "needpassword",
      "login_required",
      "need_login"
    ].includes(raw)
  ){
    return"locked";
  }

  if(
    result?.unsupported===true||
    [
      "unsupported",
      "not_supported",
      "skip"
    ].includes(raw)
  ){
    return"unsupported";
  }

  if(
    result?.bad===true||
    result?.valid===false||
    [
      "bad",
      "invalid",
      "dead",
      "expired",
      "deleted",
      "failed",
      "fail",
      "error",
      "0",
      "404"
    ].includes(raw)
  ){
    return"bad";
  }

  return"uncertain";
}

function batchCheckResults(body){
  const candidates=[
    body?.data?.results,
    body?.data?.items,
    body?.results,
    body?.items,
    body?.data,
    body
  ];

  for(const value of candidates){
    if(Array.isArray(value)){
      return value;
    }
  }

  if(
    body&&
    typeof body==="object"
  ){
    const output=[];

    Object.keys(body).forEach(key=>{
      const value=body[key];

      if(
        value&&
        typeof value==="object"&&
        !Array.isArray(value)
      ){
        output.push(
          Object.assign(
            {
              url:key
            },
            value
          )
        );
      }
    });

    if(output.length){
      return output;
    }
  }

  return[];
}

function checkResultUrl(result){
  const value=
    result?.url||
    result?.link||
    result?.original_url||
    result?.originalUrl||
    result?.share_url||
    result?.shareUrl||
    "";

  if(Array.isArray(value)){
    return firstNonEmptyText(value);
  }

  return String(value||"").trim();
}

function checkedNormalizedUrl(result){
  const value=
    result?.normalized_url||
    result?.normalizedUrl||
    result?.data?.normalized_url||
    result?.data?.normalizedUrl||
    "";

  if(Array.isArray(value)){
    return firstNonEmptyText(value);
  }

  return String(value||"").trim();
}

function updatePanHealthDot(key,state){
  const current=
    $("panResults").querySelector(
      '[data-key="'+
      cssEscape(key)+
      '"]'
    );

  if(!current){
    return;
  }

  const dot=
    current.querySelector(
      ".pan-dot"
    );

  if(!dot){
    return;
  }

  dot.className=
    "pan-dot "+
    panHealthClass(state);

  current.title=
    panHealthTitle(state);
}

async function runPanBatchCheck(panToken){
  if(
    panToken!==S.pan.token||
    !S.pan.open||
    S.pan.checking
  ){
    return;
  }

  const items=
    checkablePanItems();

  if(!items.length){
    return;
  }

  const checkToken=
    ++S.pan.checkToken;

  S.pan.checking=true;

  items.forEach(item=>{
    S.pan.health.set(
      item.key,
      {
        state:"pending"
      }
    );

    updatePanHealthDot(
      item.key,
      "pending"
    );
  });

  const links=items.map(item=>({
    type:item.diskType,
    cloud_type:item.diskType,
    url:item.url,
    password:item.password||"",
    pwd:item.password||"",
    code:item.password||""
  }));

  try{
    const body=await postJson(
      panApi(PAN_CHECK_BATCH_API),
      {
        links
      },
      20
    );

    if(
      panToken!==S.pan.token||
      checkToken!==S.pan.checkToken
    ){
      return;
    }

    const results=
      batchCheckResults(body);

    const unused=[
      ...results
    ];

    items.forEach((item,index)=>{
      let result=null;

      const exactIndex=
        unused.findIndex(entry=>
          checkResultUrl(entry)===item.url||
          entry?.key===item.key
        );

      if(exactIndex>=0){
        result=unused.splice(
          exactIndex,
          1
        )[0];
      }else if(results[index]){
        result=results[index];
      }

      const state=
        result
          ?checkStateOf(result)
          :"uncertain";

      const normalized=
        result
          ?checkedNormalizedUrl(result)
          :"";

      S.pan.health.set(
        item.key,
        {
          state,
          normalizedUrl:normalized,
          raw:result||null
        }
      );

      if(
        normalized&&
        state!=="bad"
      ){
        const current=
          S.pan.map.get(item.key);

        if(current){
          current.url=normalized;
          current.normalizedUrl=normalized;
          current.checkedNormalizedUrl=normalized;

          S.pan.map.set(
            item.key,
            current
          );
        }
      }
    });

    /*
      批量更新完成后只进行一次稳定重渲染。

      renderPan 会恢复焦点 key、索引和 scrollTop，
      不会在检查过程中逐条删除当前 DOM。
    */
    buildPanGroups();
    renderPan();
  }catch(error){
    if(
      panToken!==S.pan.token||
      checkToken!==S.pan.checkToken
    ){
      return;
    }

    items.forEach(item=>{
      const old=
        S.pan.health.get(item.key);

      if(old?.state==="pending"){
        S.pan.health.set(
          item.key,
          {
            state:"uncertain"
          }
        );
      }
    });

    renderPan();

    throw error;
  }finally{
    if(
      panToken===S.pan.token&&
      checkToken===S.pan.checkToken
    ){
      S.pan.checking=false;
    }
  }
}
/* =========================================================
   播放处理

   网盘/磁力点击后不再走网页端 Go 解析、/pan/detail、
   provider list/play 或 vodInline，统一交给原生 fm.pan.play。
   ========================================================= */

function panPasswordParam(
  item,
  url
){
  const type=normDisk(
    item?.diskType||
    item?.type||
    item?.provider||
    item?.provider_key||
    item?.site||
    ""
  );

  const target=String(
    url||
    ""
  ).toLowerCase();

  if(
    type==="115"||
    /(^|\/\/)([^/]*\.)?(115|115cdn|anxia)\./i.test(target)
  ){
    return"password";
  }

  return"pwd";
}

function hasPanPassword(url){
  return/(?:[?&#])(pwd|password|passcode|code)=/i.test(
    String(
      url||
      ""
    )
  );
}

function addPanPassword(
  url,
  password,
  item
){
  let target=String(
    url||
    ""
  ).trim();

  const code=String(
    password||
    ""
  ).trim();

  if(
    !target||
    !code||
    hasPanPassword(target)
  ){
    return target;
  }

  if(/^(magnet:|ed2k:\/\/)/i.test(target)){
    return target;
  }

  const param=panPasswordParam(
    item,
    target
  );

  try{
    const parsed=new URL(target);

    parsed.searchParams.set(
      param,
      code
    );

    return parsed.toString();
  }catch(error){
    const hashIndex=target.indexOf("#");

    const base=
      hashIndex>=0
        ?target.slice(0,hashIndex)
        :target;

    const hash=
      hashIndex>=0
        ?target.slice(hashIndex)
        :"";

    const sep=base.includes("?")
      ?(
        base.endsWith("?")||
        base.endsWith("&")
          ?""
          :"&"
      )
      :"?";

    return(
      base+
      sep+
      param+
      "="+
      encodeURIComponent(code)+
      hash
    );
  }
}

function panPayloadType(item,url){
  const explicit=normDisk(
    item?.diskType||
    item?.type||
    item?.provider||
    item?.provider_key||
    item?.site||
    ""
  );

  if(
    explicit&&
    explicit!=="other"
  ){
    return explicit;
  }

  if(/^magnet:\?/i.test(String(url||""))){
    return"magnet";
  }

  return explicit||"other";
}

function buildPanPlayPayload(item){
  let url=String(
    item&&(
      item.checkedNormalizedUrl||
      item.normalizedUrl||
      item.normalized_url||
      item.url
    )||
    ""
  ).trim();

  if(!url){
    return null;
  }

  if(/^push:\/\//i.test(url)){
    url=url.replace(
      /^push:\/\//i,
      ""
    );
  }

  const current=S.currentItem||{};

  const password=String(
    item?.password||
    item?.pwd||
    item?.code||
    ""
  ).trim();

  const title=clean(
    current.title||
    item?.title||
    item?.note||
    S.pan.keyword||
    url
  );

  const pic=
    item?.pic||
    current.posterBig||
    current.poster||
    "";

  const wallPic=
    item?.wallPic||
    current.backdrop||
    current.posterBig||
    current.poster||
    pic;

  return{
    type:panPayloadType(item,url),
    url,
    password,
    title,
    pic,
    wallPic
  };
}

async function openPanItem(
  item,
  node
){
  if(
    !item||
    S.playOpening
  ){
    return;
  }

  const payload=buildPanPlayPayload(
    item
  );

  if(!payload){
    toast(
      "播放失败：播放地址为空"
    );

    return;
  }

  const playToken=
    ++S.playToken;

  S.playOpening=true;

  if(node){
    node.classList.add(
      "resolving"
    );
  }

  try{
    if(
      window.fongmiBridge&&
      !window.fm
    ){
      await waitForNativeSdk(1500);
    }

    const pan=sdk().pan||{};

    if(typeof pan.play!=="function"){
      throw Error(
        "当前 App 不支持 pan.play"
      );
    }

    console.log(
      "[pan.play payload]",
      payload
    );

    toast(
      "正在交给原生播放..."
    );

    const result=pan.play(
      payload
    );

    if(
      result&&
      typeof result.then==="function"
    ){
      await result;
    }

    if(playToken!==S.playToken){
      return;
    }

    toast(
      "已交给原生播放"
    );
  }catch(error){
    if(playToken!==S.playToken){
      return;
    }

    console.error(
      "[pan.play failed]",
      error
    );

    toast(
      "播放失败："+(
        error?.message||
        error
      )
    );
  }finally{
    if(playToken===S.playToken){
      S.playOpening=false;
    }

    if(node?.isConnected){
      node.classList.remove(
        "resolving"
      );
    }
  }
}
/* =========================================================
   焦点基础工具
   ========================================================= */

function usable(element){
  if(
    !element||
    !element.isConnected||
    element.disabled||
    element.hidden||
    element.getAttribute("tabindex")==="-1"||
    element.closest?.(
      '[aria-hidden="true"]'
    )
  ){
    return false;
  }

  const style=
    getComputedStyle(element);

  const rect=
    element.getBoundingClientRect();

  return(
    style.display!=="none"&&
    style.visibility!=="hidden"&&
    rect.width>0&&
    rect.height>0
  );
}

const els=(selector,root=document)=>
  [
    ...root.querySelectorAll(selector)
  ].filter(usable);

function focusEl(element){
  if(!element){
    return false;
  }

  try{
    element.focus({
      preventScroll:true
    });
  }catch(error){
    try{
      element.focus();
    }catch(innerError){
      return false;
    }
  }

  return true;
}

function keep(
  element,
  root
){
  if(
    !element||
    !root
  ){
    return;
  }

  const elementRect=
    element.getBoundingClientRect();

  const rootRect=
    root.getBoundingClientRect();

  if(elementRect.top<rootRect.top){
    root.scrollTop-=
      rootRect.top-
      elementRect.top+
      4;
  }else if(
    elementRect.bottom>
    rootRect.bottom
  ){
    root.scrollTop+=
      elementRect.bottom-
      rootRect.bottom+
      4;
  }

  if(elementRect.left<rootRect.left){
    root.scrollLeft-=
      rootRect.left-
      elementRect.left+
      4;
  }else if(
    elementRect.right>
    rootRect.right
  ){
    root.scrollLeft+=
      elementRect.right-
      rootRect.right+
      4;
  }
}

function reveal(
  element,
  root
){
  if(!element){
    return false;
  }

  focusEl(element);

  if(root){
    keep(
      element,
      root
    );
  }else{
    element.scrollIntoView?.({
      block:"nearest",
      inline:"nearest"
    });
  }

  return true;
}

function focusHome(
  element,
  scroll=false
){
  if(!element){
    return false;
  }

  focusEl(element);

  if(scroll){
    element.scrollIntoView?.({
      block:"nearest",
      inline:"nearest"
    });
  }

  return true;
}

function nearestIn(
  root,
  direction,
  selector=".focusable"
){
  if(!root){
    return null;
  }

  const candidates=
    els(
      selector,
      root
    );

  const current=
    document.activeElement;

  if(!usable(current)){
    return candidates[0]||null;
  }

  const currentRect=
    current.getBoundingClientRect();

  const currentX=
    currentRect.left+
    currentRect.width/2;

  const currentY=
    currentRect.top+
    currentRect.height/2;

  let best=null;
  let bestScore=Infinity;

  candidates.forEach(element=>{
    if(element===current){
      return;
    }

    const rect=
      element.getBoundingClientRect();

    const x=
      rect.left+
      rect.width/2;

    const y=
      rect.top+
      rect.height/2;

    const dx=x-currentX;
    const dy=y-currentY;

    if(
      direction==="Left"&&
      dx>=-4
    ){
      return;
    }

    if(
      direction==="Right"&&
      dx<=4
    ){
      return;
    }

    if(
      direction==="Up"&&
      dy>=-4
    ){
      return;
    }

    if(
      direction==="Down"&&
      dy<=4
    ){
      return;
    }

    const horizontal=
      direction==="Left"||
      direction==="Right";

    const primary=
      horizontal
        ?Math.abs(dx)
        :Math.abs(dy);

    const secondary=
      horizontal
        ?Math.abs(dy)
        :Math.abs(dx);

    const score=
      primary*1000+
      secondary*8;

    if(score<bestScore){
      bestScore=score;
      best=element;
    }
  });

  return best;
}

/* =========================================================
   按键识别
   ========================================================= */

function keyOf(event){
  const key=event.key||"";

  if(
    key==="Enter"||
    key==="OK"
  ){
    return"Enter";
  }

  if(
    key==="Escape"||
    key==="Backspace"||
    key==="BrowserBack"
  ){
    return"Back";
  }

  if(key==="ArrowUp"){
    return"Up";
  }

  if(key==="ArrowDown"){
    return"Down";
  }

  if(key==="ArrowLeft"){
    return"Left";
  }

  if(key==="ArrowRight"){
    return"Right";
  }

  if(key==="PageUp"){
    return"PageUp";
  }

  if(key==="PageDown"){
    return"PageDown";
  }

  if(key==="Home"){
    return"Home";
  }

  if(
    event.keyCode===13||
    event.keyCode===23||
    event.keyCode===66
  ){
    return"Enter";
  }

  if(
    event.keyCode===4||
    event.keyCode===27||
    event.keyCode===8
  ){
    return"Back";
  }

  if(event.keyCode===19){
    return"Up";
  }

  if(event.keyCode===20){
    return"Down";
  }

  if(event.keyCode===21){
    return"Left";
  }

  if(event.keyCode===22){
    return"Right";
  }

  if(event.keyCode===92){
    return"PageUp";
  }

  if(event.keyCode===93){
    return"PageDown";
  }

  if(event.keyCode===122){
    return"Home";
  }

  return key;
}

function eat(event){
  event.preventDefault?.();
  event.stopPropagation?.();
  event.stopImmediatePropagation?.();
}

function saveDetailFirstReturn(element){
  S.detailFirstReturn=
    element||
    document.activeElement||
    $("detailPanBtn");

  if(
    element?.closest?.("#panResults")
  ){
    const items=allPanItems();

    S.detailFirstReturnKey=
      element.dataset.key||
      "";

    S.detailFirstReturnType=
      S.pan.type||
      "";

    S.detailFirstReturnIndex=
      items.indexOf(element);

    S.pan.focusKey=
      S.detailFirstReturnKey;

    S.pan.focusType=
      S.detailFirstReturnType;

    S.pan.focusIndex=
      S.detailFirstReturnIndex;

    S.pan.scrollTop=
      $("panResults").scrollTop;
  }else{
    S.detailFirstReturnKey="";
    S.detailFirstReturnType="";
    S.detailFirstReturnIndex=-1;
  }
}

function enterDetailSecond(returnElement){
  saveDetailFirstReturn(
    returnElement
  );

  $("detail").classList.add(
    "second-open"
  );

  const top=
    $("detailSecond").offsetTop;

  $("detail").scrollTo({
    top,
    behavior:"auto"
  });

  requestAnimationFrame(()=>{
    $("detail").scrollTop=top;

    focusEl(
      activeDetailTab()
    );
  });

  return true;
}

function findSavedPanResource(){
  const root=$("panResults");
  const items=allPanItems();

  let target=null;

  if(S.detailFirstReturnKey){
    target=root.querySelector(
      '[data-key="'+
      cssEscape(
        S.detailFirstReturnKey
      )+
      '"]'
    );
  }

  if(
    !target&&
    items.length&&
    S.detailFirstReturnIndex>=0
  ){
    const index=Math.max(
      0,
      Math.min(
        S.detailFirstReturnIndex,
        items.length-1
      )
    );

    target=items[index];
  }

  if(
    !target&&
    S.pan.focusKey
  ){
    target=root.querySelector(
      '[data-key="'+
      cssEscape(
        S.pan.focusKey
      )+
      '"]'
    );
  }

  return target;
}

function returnDetailFirst(){
  $("detail").classList.remove(
    "second-open"
  );

  $("detail").scrollTo({
    top:0,
    behavior:"auto"
  });

  requestAnimationFrame(()=>{
    $("detail").scrollTop=0;

    let target=null;

    if(S.pan.open){
      target=
        findSavedPanResource();

      if(!target){
        target=
          activePanType()||
          $("panResults").querySelector(
            ".pan-item"
          )||
          $("detailPanBtn");
      }
    }else if(
      usable(
        S.detailFirstReturn
      )&&
      S.detailFirstReturn.closest?.(
        ".detail-first"
      )
    ){
      target=
        S.detailFirstReturn;
    }

    if(!target){
      target=$("detailPanBtn");
    }

    if(target.closest?.("#panResults")){
      $("panResults").scrollTop=
        Math.max(
          0,
          S.pan.scrollTop||
          0
        );

      focusPanItem(
        target

    }else{
      focusEl(target);
    }
  });

  return true;
}

/*
  盘搜资源导航直接使用全部 .pan-item DOM，
  不使用 usable() 过滤当前可见区域。

  这样即使目标资源尚未出现在资源框可视区域内，
  也可以先移动焦点，再调整 scrollTop，
  从第一条连续移动到最后一条。
*/
function movePanResultsFocus(direction){
  const current=
    document.activeElement;

  const list=
    allPanItems();

  const index=
    list.indexOf(current);

  if(index<0){
    const remembered=
      findSavedPanResource();

    if(remembered){
      return focusPanItem(
        remembered
      );
    }

    return reveal(
      activePanType()||
      $("detailPanBtn")
    );
  }

  S.pan.focusKey=
    current.dataset.key||
    "";

  S.pan.focusIndex=index;
  S.pan.focusType=S.pan.type;
  S.pan.scrollTop=
    $("panResults").scrollTop;

  if(direction==="Up"){
    if(index<=0){
      return reveal(
        activePanType()||
        $("detailPanBtn"),
        $("panTypes")
      );
    }

    return focusPanItem(
      list[index-1]
    );
  }

  if(direction==="Down"){
    if(index>=list.length-1){
      /*
        最后一条继续按下时保持焦点，
        不跳出资源框。
      */
      ensurePanItemVisible(
        current
      );

      return true;
    }

    return focusPanItem(
      list[index+1]
    );
  }

  if(direction==="Left"){
    return reveal(
      activePanType()||
      $("detailPanBtn"),
      $("panTypes")
    );
  }

  if(direction==="Right"){
    return enterDetailSecond(
      current
    );
  }

  return false;
}

/* =========================================================
   信息 Tab 导航
   ========================================================= */

function moveInfoTabFocus(direction){
  const current=
    document.activeElement;

  const tab=
    activeDetailTab();

  if(current===$("infoText")){
    if(direction==="Up"){
      return reveal(tab);
    }

    if(direction==="Down"){
      const cast=
        $("castGrid").querySelector(
          ".person-card"
        );

      const work=
        $("personWorkGrid").querySelector(
          ".vod-card"
        );

      if(cast){
        return reveal(
          cast,
          $("tabContent")
        );
      }

      if(work){
        return reveal(
          work,
          $("tabContent")
        );
      }

      return true;
    }

    return true;
  }

  if(current?.closest("#castGrid")){
    const list=
      els(
        ".person-card",
        $("castGrid")
      );

    const index=
      list.indexOf(current);

    const columns=5;

    if(index<0){
      return false;
    }

    if(direction==="Left"){
      if(index%columns===0){
        return true;
      }

      return reveal(
        list[index-1],
        $("tabContent")
      );
    }

    if(direction==="Right"){
      if(
        index%columns===columns-1||
        index>=list.length-1
      ){
        return true;
      }

      return reveal(
        list[index+1],
        $("tabContent")
      );
    }

    if(direction==="Up"){
      const next=index-columns;

      if(next<0){
        return reveal(
          $("infoText")||
          tab,
          $("tabContent")
        );
      }

      return reveal(
        list[next],
        $("tabContent")
      );
    }

    if(direction==="Down"){
      const next=index+columns;

      if(next<list.length){
        return reveal(
          list[next],
          $("tabContent")
        );
      }

      const works=
        els(
          ".vod-card",
          $("personWorkGrid")
        );

      if(works.length){
        const column=
          index%columns;

        return reveal(
          works[
            Math.min(
              column,
              works.length-1
            )
          ],
          $("tabContent")
        );
      }

      return true;
    }

    return false;
  }

  if(
    current?.closest(
      "#personWorkGrid"
    )
  ){
    const works=
      els(
        ".vod-card",
        $("personWorkGrid")
      );

    const index=
      works.indexOf(current);

    const columns=5;

    if(index<0){
      return false;
    }

    if(direction==="Left"){
      if(index%columns===0){
        return true;
      }

      return reveal(
        works[index-1],
        $("tabContent")
      );
    }

    if(direction==="Right"){
      if(
        index%columns===columns-1||
        index>=works.length-1
      ){
        return true;
      }

      return reveal(
        works[index+1],
        $("tabContent")
      );
    }

    if(direction==="Up"){
      const next=index-columns;

      if(next>=0){
        return reveal(
          works[next],
          $("tabContent")
        );
      }

      const cast=
        els(
          ".person-card",
          $("castGrid")
        );

      if(cast.length){
        const column=
          index%columns;

        const lastRowStart=
          Math.floor(
            (
              cast.length-
              1
            )/
            columns
          )*
          columns;

        return reveal(
          cast[
            Math.min(
              lastRowStart+
              column,
              cast.length-1
            )
          ],
          $("tabContent")
        );
      }

      return reveal(
        $("infoText")||
        tab,
        $("tabContent")
      );
    }

    if(direction==="Down"){
      const next=
        index+
        columns;

      if(next<works.length){
        return reveal(
          works[next],
          $("tabContent")
        );
      }

      return true;
    }

    return false;
  }

  return false;
}

      if(index>=list.length-1){
        return true;
      }

      return reveal(
        list[index+1],
        $("tabContent")
      );
    }

    if(direction==="Left"){
      return reveal(
        activeSeasonTab()||
        tab,
        $("tabContent")
      );
    }

    if(direction==="Right"){
      return true;
    }

    return false;
  }

  return false;
}

/* =========================================================
   推荐和剧照五列导航
   ========================================================= */

function moveFiveColumnGrid(
  current,
  root,
  direction,
  topTarget
){
  const list=
    els(
      ".focusable",
      root
    );

  const index=
    list.indexOf(current);

  if(index<0){
    return false;
  }

  const columns=5;

  if(direction==="Left"){
    if(index%columns===0){
      return true;
    }

    return reveal(
      list[index-1],
      $("tabContent")
    );
  }

  if(direction==="Right"){
    if(
      index%columns===columns-1||
      index>=list.length-1
    ){
      return true;
    }

    return reveal(
      list[index+1],
      $("tabContent")
    );
  }

  if(direction==="Up"){
    const next=index-columns;

    if(next<0){
      return reveal(topTarget);
    }

    return reveal(
      list[next],
      $("tabContent")
    );
  }

  if(direction==="Down"){
    const next=index+columns;

    if(next>=list.length){
      return true;
    }

    return reveal(
      list[next],
      $("tabContent")
    );
  }

  return false;
}

function moveDetailContentFocus(direction){

  if(

    current?.closest("#castGrid")||

  }

  if(direction==="Up"){
    return reveal(
      activeDetailTab()
    );
  }

  return false;
}

   搜索层导航

function moveSearchFocus(direction){
  const current=
    document.activeElement;

  const back=
    $("searchBackBtn");

  const input=
    $("searchInput");

  const submit=
    $("searchSubmitBtn");

  const results=
    els(
      ".search-item",
      $("searchPanel")
    );

  if(
    current===back||
    current===input||
    current===submit
  ){
    if(direction==="Left"){
      if(current===submit){
        return reveal(input);
      }

      if(current===input){
        return reveal(back);
      }

      return true;
    }

    if(direction==="Right"){
      if(current===back){
        return reveal(input);
      }

      if(current===input){
        return reveal(submit);
      }

      return true;
    }

    if(direction==="Down"){
      if(results.length){
        return reveal(
          results[0],
          $("searchPanel")
        );
      }

      return true;
    }

    if(direction==="Up"){
      return true;
    }

    return false;
  }

  if(current?.closest("#searchPanel")){
    const index=
      results.indexOf(current);

    if(index<0){
      return reveal(input);
    }

    if(direction==="Up"){
      if(index<=0){
        return reveal(input);
      }

      return reveal(
        results[index-1],
        $("searchPanel")
      );
    }

    if(direction==="Down"){
      if(index>=results.length-1){
        return true;
      }

      return reveal(
        results[index+1],
        $("searchPanel")
      );
    }

    if(direction==="Left"){
      return reveal(input);
    }

    if(direction==="Right"){
      return reveal(submit);
    }

    return false;
  }

  return reveal(input);
}

/* =========================================================
   首页网格自动分页焦点
   ========================================================= */

function waitForHomeCard(
  index,
  timeout=6000
){
  return new Promise(resolve=>{
    const start=Date.now();

    function check(){
      const cards=[
        ...$("vodGrid")
          .querySelectorAll(".vod-card")
      ];

      if(cards[index]){
        resolve(cards[index]);
        return;
      }

      if(
        Date.now()-start>=timeout||
        (
          !S.loading&&
          !S.paging
        )
      ){
        resolve(null);
        return;
      }

      setTimeout(check,80);
    }

    check();
  });
}

function moveHomeCardDown(
  current,
  cards,
  index
){
  const columns=5;

  const targetIndex=
    index+
    columns;

  if(cards[targetIndex]){
    return reveal(
      cards[targetIndex]
    );
  }

  if(S.page>=S.pagecount){
    return true;
  }

  if(
    !S.loading&&
    !S.paging
  ){
    loadActive(
      S.page+1,
      true
    ).then(()=>{
      const updated=[
        ...$("vodGrid")
          .querySelectorAll(".vod-card")
      ];

      const target=
        updated[targetIndex];

      if(
        target&&
        document.activeElement===current
      ){
        reveal(target);
      }
    });
  }else{
    waitForHomeCard(
      targetIndex
    ).then(target=>{
      if(
        target&&
        document.activeElement===current
      ){
        reveal(target);
      }
    });
  }

  return true;
}

/* =========================================================
   首页方向键导航
   ========================================================= */

function moveHomeFocus(direction){
  const current=
    document.activeElement;

  if(current?.closest("#topTabs")){
    const list=
      els(
        ".tab-btn",
        $("topTabs")
      );

    const index=
      list.indexOf(current);

    if(index<0){
      return reveal(
        $("topTabs").querySelector(
          ".tab-btn.active"
        )||
        list[0],
        $("topTabs")
      );
    }

    if(direction==="Left"){
      if(index===0){
        openSide(current);
        return true;
      }

      return reveal(
        list[index-1],
        $("topTabs")
      );
    }

    if(direction==="Right"){
      if(index>=list.length-1){
        return true;
      }

      return reveal(
        list[index+1],
        $("topTabs")
      );
    }

    if(direction==="Down"){
      return reveal(
        $("heroCard")
      );
    }

    if(direction==="Up"){
      return true;
    }

    return false;
  }

  if(current===$("heroCard")){
    if(direction==="Up"){
      return reveal(
        $("topTabs").querySelector(
          ".tab-btn.active"
        )||
        $("topTabs").querySelector(
          ".tab-btn"
        ),
        $("topTabs")
      );
    }

    if(direction==="Down"){
      const first=
        $("vodGrid").querySelector(
          ".vod-card"
        );

      if(first){
        return reveal(first);
      }

      return true;
    }

    if(direction==="Left"){
      if(S.heroIndex>0){
        showPreviousHero();
        return true;
      }

      openSide(current);
      return true;
    }

    if(direction==="Right"){
      showNextHero();
      return true;
    }

    return false;
  }

  if(current?.closest("#vodGrid")){
    const cards=[
      ...$("vodGrid")
        .querySelectorAll(".vod-card")
    ];

    const index=
      cards.indexOf(current);

    const columns=5;

    if(index<0){
      return reveal(
        cards[0]||
        $("heroCard")
      );
    }

    maybeAutoLoadByFocus(
      current
    );

    if(direction==="Left"){
      if(index%columns===0){
        openSide(current);
        return true;
      }

      return reveal(
        cards[index-1]
      );
    }

    if(direction==="Right"){
      const rowRightEdge=
        index%columns===
        columns-1;

      const lastCard=
        index>=cards.length-1;

      if(
        rowRightEdge||
        lastCard
      ){
        return switchToNextCategory();
      }

      return reveal(
        cards[index+1]
      );
    }

    if(direction==="Up"){
      if(index<columns){
        return reveal(
          $("heroCard")
        );
      }

      return reveal(
        cards[index-columns]
      );
    }

    if(direction==="Down"){
      return moveHomeCardDown(
        current,
        cards,
        index
      );
    }

    return false;
  }

  const target=
    nearestIn(
      $("app"),
      direction
    );

  if(target){
    return reveal(target);
  }

  return focusHome(
    $("heroCard"),
    true
  );
}

  const current=
    document.activeElement;

  if(

    )
  ){
    return false;
  }

  if(

    )

    return moveSearchFocus(
      direction
    );
  }

  if(
    document.body.classList.contains(
      "cat-open"
    )
  ){
    return moveCategoryFocus(
      direction
    );
  }

  if(
    document.body.classList.contains(
      "side-open"
    )
  ){
    return moveSideFocus(
      direction
    );
  }

  if(detailOpen()){
    if(current?.closest("#detailActions")){
      return moveDetailActionsFocus(
        direction
      );
    }

    if(current?.closest("#panTypes")){
      return movePanTypesFocus(
        direction
      );
    }

    if(current?.closest("#panResults")){
      return movePanResultsFocus(
        direction
      );
    }

    if(current?.closest("#detailTabs")){
      return moveDetailTabsFocus(
        direction
      );
    }

    if(current?.closest("#tabContent")){
      return moveDetailContentFocus(
        direction
      );
    }

    if(
      $("detail").classList.contains(
        "second-open"
      )
    ){
      return reveal(
        activeDetailTab()
      );
    }

    $("detail").scrollTo({
      top:0,
      behavior:"auto"
    });

    if(S.pan.open){
      const remembered=
        findSavedPanResource();

      if(remembered){
        return focusPanItem(
          remembered
        );
      }

      const type=
        activePanType();

      if(type){
        return reveal(
          type,
          $("panTypes")
        );
      }
    }

    return reveal(
      $("detailPanBtn")
    );
  }

  return moveHomeFocus(
    direction
  );
}

function handleBack(){
  if(
    $("viewer").classList.contains(
      "active"
    )
  ){
    closeViewer();
    return true;
  }

  if(
    document.body.classList.contains(
      "search-open"
    )
  ){
    closeSearchToSide();
    return true;
  }

  if(
    document.body.classList.contains(
      "cat-open"
    )
  ){
    closeCatPanel(true);
    return true;
  }

  if(
    document.body.classList.contains(
      "side-open"
    )
  ){
    closeSide(true);
    return true;
  }

  if(detailOpen()){
    if(
      $("detail").classList.contains(
        "second-open"
      )
    ){
      returnDetailFirst();
      return true;
    }

    closeDetailByUser();
    return true;
  }

  return false;
}
/* =========================================================
   遥控器总事件
   ========================================================= */

document.addEventListener(
  "keydown",
  event=>{
    const key=keyOf(event);

    /*
      图片查看器打开时，
      左右切换图片，返回键或确认键关闭。
    */
    if(
      $("viewer").classList.contains(
        "active"
      )
    ){
      if(
        key==="Back"||
        key==="Enter"
      ){
        eat(event);
        closeViewer();
        return;
      }

      if(key==="Left"){
        eat(event);

        S.viewerIndex--;
        showViewer();

        return;
      }

      if(key==="Right"){
        eat(event);

        S.viewerIndex++;
        showViewer();

        return;
      }

      return;
    }

    if(key==="Back"){
      if(handleBack()){
        eat(event);
      }

      return;
    }

    if(key==="Home"){
      eat(event);

      if(detailOpen()){
        $("detail").classList.remove(
          "second-open"
        );

        $("detail").scrollTo({
          top:0,
          behavior:"auto"
        });

        requestAnimationFrame(()=>{
          $("detail").scrollTop=0;

          if(S.pan.open){
            const remembered=
              findSavedPanResource();

            if(remembered){
              focusPanItem(
                remembered
              );

              return;
            }

            const type=
              activePanType();

            if(type){
              focusEl(type);
              return;
            }
          }

          focusEl(
            $("detailPanBtn")
          );
        });
      }else{
        scrollTo(0,0);

        focusHome(
          $("heroCard"),
          true
        );
      }

      return;
    }

    if(
      [
        "Up",
        "Down",
        "Left",
        "Right"
      ].includes(key)
    ){
      if(moveFocus(key)){
        eat(event);
      }

      return;
    }

    if(key==="PageDown"){
      eat(event);

      /*
        盘搜资源框获得焦点时，
        PageDown 在资源框内翻页，不滚动整个详情页。
      */
      if(
        detailOpen()&&
        document.activeElement?.closest?.(
          "#panResults"
        )
      ){
        const root=$("panResults");

        root.scrollTop=
          Math.min(
            root.scrollHeight-
            root.clientHeight,
            root.scrollTop+
            root.clientHeight-
            10
          );

        S.pan.scrollTop=
          root.scrollTop;

        const items=allPanItems();

        if(items.length){
          const rootRect=
            root.getBoundingClientRect();

          let target=null;

          for(const item of items){
            const rect=
              item.getBoundingClientRect();

            if(
              rect.top>=rootRect.top-2&&
              rect.bottom<=rootRect.bottom+2
            ){
              target=item;
            }
          }

          if(target){
            focusPanItem(target);
          }
        }

        return;
      }

      if(detailOpen()){
        $("detail").scrollBy({
          top:
            innerHeight*
            .8,

          behavior:"auto"
        });
      }else{
        scrollBy({
          top:
            innerHeight*
            .8,

          behavior:"auto"
        });
      }

      return;
    }

    if(key==="PageUp"){
      eat(event);

      /*
        盘搜资源框获得焦点时，
        PageUp 在资源框内向上翻页。
      */
      if(
        detailOpen()&&
        document.activeElement?.closest?.(
          "#panResults"
        )
      ){
        const root=$("panResults");

        root.scrollTop=
          Math.max(
            0,
            root.scrollTop-
            root.clientHeight+
            10
          );

        S.pan.scrollTop=
          root.scrollTop;

        const items=allPanItems();

        if(items.length){
          const rootRect=
            root.getBoundingClientRect();

          const target=
            items.find(item=>{
              const rect=
                item.getBoundingClientRect();

              return(
                rect.bottom>rootRect.top+2&&
                rect.top<rootRect.bottom-2
              );
            });

          if(target){
            focusPanItem(target);
          }
        }

        return;
      }

      if(detailOpen()){
        $("detail").scrollBy({
          top:
            -innerHeight*
            .8,

          behavior:"auto"
        });
      }else{
        scrollBy({
          top:
            -innerHeight*
            .8,

          behavior:"auto"
        });
      }
    }
  },
  true
);

    );

    );

    closeSearchToSide();

  /* 执行 TMDB 搜索 */
  $("searchSubmitBtn").onclick=()=>{
    doSearch();
  };

  $("searchInput").addEventListener(
    "keydown",
    event=>{
      if(keyOf(event)==="Enter"){
        eat(event);
        doSearch();
      }
    },
    true
  );

  /* 详情返回 */
  $("detailBackBtn").onclick=()=>{
    closeDetailByUser();
  };

  /* 原生全局搜索 */
  $("detailSearchBtn").onclick=()=>{
    nativeSearch(
      S.currentItem
    );
  };

  /*
    盘搜按钮：

    第一次点击执行搜索。
    再次点击关闭盘搜区域并清理当前显示。
  */
  $("detailPanBtn").onclick=()=>{
    if(S.pan.open){
      /*
        取消尚未开始的批量盘检定时器，
        并使正在执行的盘检结果失效。
      */
      clearTimeout(
        S.pan._checkTimer
      );

      S.pan._checkTimer=0;
      S.pan.checkToken++;
      S.pan.checking=false;

      closePan(true);

      focusEl(
        $("detailPanBtn")
      );
    }else{
      startPanSearch();
    }
  };

  /*
    资源框滚动只记录 scrollTop。

    不在滚动期间触发逐条盘检，
    不删除 DOM，也不主动重新聚焦。
  */
  $("panResults").addEventListener(
    "scroll",
    ()=>{
      S.pan.scrollTop=
        $("panResults").scrollTop;
    },
    {
      passive:true
    }
  );

  /*
    自动保持滚动容器中的焦点可见。

    盘搜资源框只调整 scrollTop，
    不在 focusin 中再次调用 focus()，
    避免电视 WebView 二次聚焦、焦点跳回、
    上下键只能移动前三条等问题。
  */
  document.addEventListener(
    "focusin",
    event=>{
      const element=
        event.target;

      if(element?.closest?.("#topTabs")){
        keep(
          element,
          $("topTabs")
        );
      }

      if(element?.closest?.("#catPanel")){
        keep(
          element,
          $("catPanel")
        );
      }

      if(element?.closest?.("#panTypes")){
        S.pan.focusType=
          element.dataset.type||
          S.pan.type||
          "";

        keep(
          element,
          $("panTypes")
        );
      }

      if(element?.closest?.("#panResults")){
        const list=
          allPanItems();

        S.pan.focusKey=
          element.dataset.key||
          "";

        S.pan.focusIndex=
          list.indexOf(element);

        S.pan.focusType=
          S.pan.type;

        /*
          只滚动，不再次 focus。
        */
        ensurePanItemVisible(
          element
        );

        S.pan.scrollTop=
          $("panResults").scrollTop;
      }

      if(element?.closest?.("#searchPanel")){
        keep(
          element,
          $("searchPanel")
        );
      }

      if(element?.closest?.("#tabContent")){
        keep(
          element,
          $("tabContent")
        );
      }
    }
  );

  /*
    页面进入后台时暂停 Hero 自动轮播，
    恢复前台后重新启动。
  */
  document.addEventListener(
    "visibilitychange",
    ()=>{
      if(document.hidden){
        clearTimeout(
          S.heroTimer
        );
      }else if(!detailOpen()){
        restartHeroAuto();
      }
    }
  );

  /*
    页面关闭前清理定时任务。
  */
  addEventListener(
    "beforeunload",
    ()=>{
      clearTimeout(
        S.heroTimer
      );

      clearDetailBgAuto();
      clearPanPolling();

      clearTimeout(
        S.pan._checkTimer
      );
    }
  );
}

function markTopTabActive(index){
  $("topTabs")
    .querySelectorAll(
      ".tab-btn"
    )
    .forEach(button=>{
      button.classList.toggle(
        "active",
        Number(
          button.dataset.index
        )===Number(index)
      );
    });
}

function scheduleTopCategory(index){
  index=Number(index);
  if(
    index<0||
    index>=CATS.length
  ){
    return;
  }
  markTopTabActive(index);
  clearTimeout(
    S._categoryFocusTimer
  );
  if(index===S.activeIndex){
    return;
  }
  S._categoryFocusTimer=setTimeout(()=>{
    const active=
      document.activeElement;
    if(
      !active||
      !active.closest?.("#topTabs")||
      Number(
        active.dataset.index
      )!==index
    ){
      return;
    }
    // 核心修复：传入 silentFocus = true，只加载数据，绝不抢夺焦点
    selectCategory(
      index,
      false,
      true,
      true 
    );
  },250); // 从160ms提升到250ms，过滤掉遥控器快速滑过的废请求
}

renderTabs=function(){
  const root=$("topTabs");
  root.replaceChildren();
  CATS.forEach((category,index)=>{
    const button=
      document.createElement("button");
    button.className=
      "tab-btn rainbow-focus focusable"+
      (
        index===S.activeIndex
          ?" active"
          :""
      );
    button.type="button";
    button.dataset.index=index;
    button.textContent=category.name;
    button.onfocus=()=>{
      scheduleTopCategory(
        index
      );
    };
    button.onclick=()=>{
      clearTimeout(
        S._categoryFocusTimer
      );
      if(index===S.activeIndex){
        markTopTabActive(index);
        return;
      }
      selectCategory(
        index,
        true,
        true,
        false
      );
    };
    root.appendChild(button);
  });
};

selectCategory=async function(
  index,
  focusTab=false,
  preserveTabDom=false,
  silentFocus=false
){
  index=Number(index);
  if(
    index<0||
    index>=CATS.length
  ){
    return false;
  }
  clearTimeout(
    S._categoryFocusTimer
  );
  const token=
    ++S.categoryToken;
  S.categorySwitching=true;
  S.activeIndex=index;
  S.items=[];
  S.page=1;
  S.pagecount=1;
  S.heroIndex=0;
  S.heroLastUrl="";
  S.loading=false;
  S.paging=false;
  clearTimeout(
    S.heroTimer
  );
  clearHeroBg();
  if(preserveTabDom){
    markTopTabActive(index);
  }else{
    renderTabs();
  }
  renderCatPanel();
  renderHero(true);
  renderGridInitial();
  try{
    await loadActive(
      1,
      false
    );
  }finally{
    if(token===S.categoryToken){
      S.categorySwitching=false;
    }
  }
  if(token!==S.categoryToken){
    return false;
  }
  requestAnimationFrame(()=>{
    // 核心修复：如果是静默加载，不去强制页面归零，也不抢焦点
    if (!silentFocus) {
      scrollTo(0,0);
    }
    setTimeout(()=>{
      if (silentFocus) {
        return; // 用户正在快速浏览分类栏，直接放行
      }
      if(focusTab){
        const target=
          $("topTabs").querySelector(
            '[data-index="'+
            index+
            '"]'
          )||
          $("topTabs").querySelector(
            ".tab-btn.active"
          );
        focusEl(
          target||
          $("heroCard")
        );
        if(target){
          keep(
            target,
            $("topTabs")
          );
        }
      }else{
        focusHome(
          $("heroCard"),
          true
        );
      }
    },120);
  });
  return true;
};

switchToNextCategory=function(){
  const next=
    (
      S.activeIndex+1
    )%
    CATS.length;

  selectCategory(
    next,
    false,
    false
  );

  return true;
};

/* =========================================================
   3. 恢复首页方向键逻辑
      网格第一排上键 -> 大图海报
      大图海报上键 -> 当前分类
   ========================================================= */
moveHomeFocus=function(direction){
  const current=
    document.activeElement;
  if(current?.closest("#topTabs")){
    const list=[
      ...$("topTabs")
        .querySelectorAll(
          ".tab-btn"
        )
    ].filter(item=>
      !item.disabled
    );
    const index=
      list.indexOf(current);
    if(index<0){
      return reveal(
        $("topTabs").querySelector(
          ".tab-btn.active"
        )||
        list[0],
        $("topTabs")
      );
    }
    if(direction==="Left"){
      if(index===0){
        openSide(current);
        return true;
      }
      return reveal(
        list[index-1],
        $("topTabs")
      );
    }
    if(direction==="Right"){
      if(index>=list.length-1){
        return true;
      }
      return reveal(
        list[index+1],
        $("topTabs")
      );
    }
    if(direction==="Down"){
      return reveal(
        $("heroCard")
      );
    }
    if(direction==="Up"){
      return true;
    }
    return false;
  }
  if(current===$("heroCard")){
    if(direction==="Up"){
      // 核心修复：手动滚动页面到顶部，并移除传入的 $("topTabs") 限制！
      window.scrollTo(0, 0); 
      return reveal(
        $("topTabs").querySelector(
          '[data-index="'+
          S.activeIndex+
          '"]'
        )||
        $("topTabs").querySelector(
          ".tab-btn.active"
        )||
        $("topTabs").querySelector(
          ".tab-btn"
        )
      ); // <--- 注意这里去掉了之前的 ,$("topTabs")
    }
    if(direction==="Down"){
      const first=
        $("vodGrid").querySelector(
          ".vod-card"
        );
      if(first){
        return reveal(first);
      }
      return true;
    }
    if(direction==="Left"){
      if(S.heroIndex>0){
        showPreviousHero();
        return true;
      }
      openSide(current);
      return true;
    }
    if(direction==="Right"){
      showNextHero();
      return true;
    }
    return false;
  }
  if(current?.closest("#vodGrid")){
    const cards=[
      ...$("vodGrid")
        .querySelectorAll(
          ".vod-card"
        )
    ];
    const index=
      cards.indexOf(current);
    const columns=5;
    if(index<0){
      return reveal(
        cards[0]||
        $("heroCard")
      );
    }
    maybeAutoLoadByFocus(
      current
    );
    if(direction==="Left"){
      if(index%columns===0){
        openSide(current);
        return true;
      }
      return reveal(
        cards[index-1]
      );
    }
    if(direction==="Right"){
      const rowRightEdge=
        index%columns===
        columns-1;
      const lastCard=
        index>=cards.length-1;
      if(
        rowRightEdge||
        lastCard
      ){
        return switchToNextCategory();
      }
      return reveal(
        cards[index+1]
      );
    }
    if(direction==="Up"){
      if(index<columns){
        return reveal(
          $("heroCard")
        );
      }
      return reveal(
        cards[index-columns]
      );
    }
    if(direction==="Down"){
      return moveHomeCardDown(
        current,
        cards,
        index
      );
    }
    return false;
  }
  const target=
    nearestIn(
      $("app"),
      direction
    );
  if(target){
    return reveal(target);
  }
  return focusHome(
    $("heroCard"),
    true
  );
};

/* =========================================================
   4. 盘搜网盘类型排序和状态排序
   ========================================================= */
const FINAL_PAN_TYPE_ORDER=[
  "115",
  "baidu",
  "quark",
  "magnet",
  "uc",
  "aliyun",
  "xunlei",
  "123",
  "mobile",
  "tianyi",
  "pikpak",
  "ed2k",
  "other"
];

function panTypeRank(type){
  const index=
    FINAL_PAN_TYPE_ORDER.indexOf(type);

  return index>=0
    ?index
    :999;
}

function panHealthRank(item){
  const state=
    S.pan.health.get(
      item.key
    )?.state||
    "idle";

  /*
    有效排最前；
    未检测、状态不确定排后；
    bad 已经在 buildPanGroups 里过滤掉。
  */
  if(state==="ok"){
    return 0;
  }

  if(state==="locked"){
    return 1;
  }

  if(
    state==="pending"||
    state==="uncertain"||
    state==="unsupported"||
    state==="idle"
  ){
    return 2;
  }

  return 3;
}

function sortPanItemList(list){
  return list
    .map((item,index)=>({
      item,
      index
    }))
    .sort((a,b)=>
      panHealthRank(a.item)-
      panHealthRank(b.item)||
      (
        b.item.score||
        0
      )-
      (
        a.item.score||
        0
      )||
      (
        b.item.timestamp||
        0
      )-
      (
        a.item.timestamp||
        0
      )||
      String(
        a.item.note||
        a.item.title||
        ""
      ).localeCompare(
        String(
          b.item.note||
          b.item.title||
          ""
        ),
        "zh-Hans-CN"
      )||
      a.item.index-
      b.item.index||
      a.index-
      b.index
    )
    .map(entry=>entry.item);
}

buildPanGroups=function(){
  const groups={};

  [
    ...S.pan.map.values()
  ].forEach(item=>{
    const health=
      getHealth(item);

    /*
      无效链接不显示。
      只有明确 bad 才隐藏。
    */
    if(health.state==="bad"){
      return;
    }

    (
      groups[item.diskType]||
      (
        groups[item.diskType]=[]
      )
    ).push(item);
  });

  Object.keys(groups).forEach(type=>{
    groups[type]=sortPanItemList(
      groups[type]
    );
  });

  S.pan.groups=groups;

  if(
    !S.pan.type||
    !groups[S.pan.type]?.length
  ){
    S.pan.type=
      FINAL_PAN_TYPE_ORDER.find(
        type=>
          groups[type]?.length
      )||
      Object.keys(groups)
        .sort((a,b)=>
          panTypeRank(a)-
          panTypeRank(b)
        )[0]||
      "";
  }
};

function panVisibleTypes(){
  return Object.keys(S.pan.groups)
    .filter(type=>
      S.pan.groups[type]?.length
    )
    .sort((a,b)=>
      panTypeRank(a)-
      panTypeRank(b)||
      String(a).localeCompare(
        String(b),
        "zh-Hans-CN"
      )
    );
}

/* =========================================================
   5. 盘搜先显示类别，点击类别再展开资源
   ========================================================= */
renderPan=function(){
  const typeRoot=$("panTypes");
  const resultRoot=$("panResults");

  const previous=
    capturePanViewState();

  savePanViewState();

  typeRoot.replaceChildren();
  resultRoot.replaceChildren();

  const types=
    panVisibleTypes();

  if(
    S.pan.loading&&
    !types.length
  ){
    resultRoot.innerHTML=
      '<div class="empty" style="min-height:80px">'+
      "盘搜中..."+
      "</div>";
    return;
  }

  if(!types.length){
    resultRoot.innerHTML=
      '<div class="empty" style="min-height:80px">'+
      "暂无盘搜结果"+
      "</div>";
    return;
  }

  types.forEach(type=>{
    const button=
      document.createElement("button");

    button.className=
      "pan-type rainbow-focus fill-focus focusable"+
      (
        type===S.pan.type
          ?" current"
          :""
      );

    button.dataset.type=type;

    button.textContent=
      diskName(type)+
      " "+
      S.pan.groups[type].length;

    button.onclick=()=>{
      savePanViewState();

      S.pan.type=type;
      S.pan.expandedType=type;
      S.pan.focusType=type;
      S.pan.focusKey="";
      S.pan.focusIndex=-1;
      S.pan.scrollTop=0;

      renderPan();

      setTimeout(()=>{
        const first=
          $("panResults").querySelector(
            ".pan-item"
          );

        if(first){
          focusPanItem(first);
          return;
        }

        focusEl(
          $("panTypes").querySelector(
            '[data-type="'+
            cssEscape(type)+
            '"]'
          )
        );
      },20);
    };

    typeRoot.appendChild(button);
  });

  /*
    关键：
    初始只显示网盘类别，不显示具体资源。
    点击类别后才展开该类别下资源。
  */
  if(!S.pan.expandedType){
    resultRoot.innerHTML=
      '<div class="empty" style="min-height:80px">'+
      "请选择网盘类别"+
      "</div>";

    requestAnimationFrame(()=>{
      if(previous.wasTypeFocused===true){
        const target=
          $("panTypes").querySelector(
            '[data-type="'+
            cssEscape(
              previous.type||
              S.pan.type
            )+
            '"]'
          );

        if(target){
          focusEl(target);
        }
      }
    });

    return;
  }

  const list=
    S.pan.groups[S.pan.expandedType]||
    [];

  if(!list.length){
    resultRoot.innerHTML=
      '<div class="empty" style="min-height:80px">'+
      "该网盘暂无可用结果"+
      "</div>";
    return;
  }

  list.forEach((item,index)=>{
    const health=
      getHealth(item);

    const button=
      document.createElement("button");

    button.className=
      "pan-item rainbow-focus fill-focus focusable";

    button.dataset.key=item.key;
    button.dataset.index=index;

    const dotClass=
      panHealthClass(
        health.state
      );

    button.title=
      panHealthTitle(
        health.state
      );

    button.innerHTML=
      '<span class="pan-dot '+
      esc(dotClass)+
      '"></span>'+
      "<span>"+
        '<div class="pan-item-title">'+
          esc(
            item.title||
            item.note||
            "资源"
          )+
        "</div>"+
      "</span>";

    button.onclick=()=>{
      S.pan.focusKey=item.key;
      S.pan.focusIndex=index;
      S.pan.focusType=S.pan.expandedType;
      S.pan.scrollTop=resultRoot.scrollTop;

      openPanItem(
        item,
        button
      );
    };

    button.addEventListener(
      "focus",
      ()=>{
        S.pan.focusKey=item.key;
        S.pan.focusIndex=index;
        S.pan.focusType=S.pan.expandedType;
        S.pan.scrollTop=resultRoot.scrollTop;

        ensurePanItemVisible(button);
      }
    );

    resultRoot.appendChild(button);
  });

  restorePanViewState(
    previous
  );
};

openPan=function(openFocus=true){
  $("detail").classList.remove(
    "second-open"
  );

  $("detail").classList.add(
    "pan-open"
  );

  S.pan.open=true;

  /*
    第一次打开盘搜时，只展示类别，不自动展开资源。
  */
  if(!S.pan.expandedType){
    S.pan.expandedType="";
  }

  renderPan();

  if(openFocus){
    setTimeout(()=>{
      focusEl(
        $("panTypes").querySelector(
          ".pan-type.current"
        )||
        $("panTypes").querySelector(
          ".pan-type"
        )||
        $("detailPanBtn")
      );
    },30);
  }
};

startPanSearch=async function(){
  const item=S.currentItem;

  if(!item){
    return;
  }

  const variants=titleVariants(
    item,
    S.detail
  );

  const keyword=clean(
    variants.keyword||
    item.title
  );

  const oldToken=Number(
    S.pan.token||
    0
  );

  const oldCheckToken=Number(
    S.pan.checkToken||
    0
  );

  S.pan={
    open:true,
    keyword,
    map:new Map(),
    groups:{},
    type:"",
    expandedType:"",
    health:new Map(),
    pollTimers:[],
    token:oldToken+1,
    loading:true,
    checking:false,
    checkToken:oldCheckToken+1,
    focusKey:"",
    focusType:"",
    focusIndex:-1,
    scrollTop:0
  };

  openPan(true);

  const token=S.pan.token;

  try{
    const body=await requestPanSearch(
      keyword
    );

    if(token!==S.pan.token){
      return;
    }

    mergePan(
      normalizePanBody(body)
    );

    S.pan.loading=false;

    renderPan();

    /*
      搜索首批完成后，只检查百度和夸克前 50 条。
      115 不盘检。
    */
    schedulePanBatchCheck(
      token,
      100
    );

    schedulePanPolling(token);
  }catch(error){
    if(token!==S.pan.token){
      return;
    }

    S.pan.loading=false;

    renderPan();

    toast(
      "盘搜失败："+error.message
    );
  }
};

schedulePanPolling=function(token){
  clearPanPolling();

  PAN_SEARCH_POLL_INTERVALS.forEach(delay=>{
    const timer=setTimeout(async()=>{
      if(
        token!==S.pan.token||
        !detailOpen()||
        !S.pan.open
      ){
        return;
      }

      try{
        const body=await requestPanSearch(
          S.pan.keyword
        );

        if(token!==S.pan.token){
          return;
        }

        mergePan(
          normalizePanBody(body)
        );

        renderPan();

        schedulePanBatchCheck(
          token,
          120
        );
      }catch(error){
        console.warn(
          "[PanSou polling failed]",
          error
        );
      }
    },delay);

    S.pan.pollTimers.push(timer);
  });
};

/* =========================================================
   6. 盘检：只检查百度、夸克，前 50 条
   ========================================================= */
checkablePanItems=function(){
  const output=[];

  [
    "baidu",
    "quark"
  ].forEach(type=>{
    const list=
      sortPanItemList(
        S.pan.groups[type]||
        []
      ).slice(0,50);

    list.forEach(item=>{
      const state=
        S.pan.health.get(
          item.key
        )?.state;

      if(
        state==="ok"||
        state==="locked"||
        state==="bad"||
        state==="unsupported"
      ){
        return;
      }

      output.push(item);
    });
  });

  return output;
};

runPanBatchCheck=async function(panToken){
  if(
    panToken!==S.pan.token||
    !S.pan.open||
    S.pan.checking
  ){
    return;
  }

  const items=
    checkablePanItems();

  if(!items.length){
    return;
  }

  const checkToken=
    ++S.pan.checkToken;

  S.pan.checking=true;

  items.forEach(item=>{
    S.pan.health.set(
      item.key,
      {
        state:"pending"
      }
    );

    updatePanHealthDot(
      item.key,
      "pending"
    );
  });

  const links=items.map(item=>({
    type:item.diskType,
    cloud_type:item.diskType,
    url:item.url,
    password:item.password||"",
    pwd:item.password||"",
    code:item.password||""
  }));

  try{
    const body=await postJson(
      panApi(PAN_CHECK_BATCH_API),
      {
        links
      },
      25
    );

    if(
      panToken!==S.pan.token||
      checkToken!==S.pan.checkToken
    ){
      return;
    }

    const results=
      batchCheckResults(body);

    const unused=[
      ...results
    ];

    items.forEach((item,index)=>{
      let result=null;

      const exactIndex=
        unused.findIndex(entry=>
          checkResultUrl(entry)===item.url||
          entry?.key===item.key
        );

      if(exactIndex>=0){
        result=unused.splice(
          exactIndex,
          1
        )[0];
      }else if(results[index]){
        result=results[index];
      }

      const state=
        result
          ?checkStateOf(result)
          :"uncertain";

      const normalized=
        result
          ?checkedNormalizedUrl(result)
          :"";

      S.pan.health.set(
        item.key,
        {
          state,
          normalizedUrl:normalized,
          raw:result||null
        }
      );

      if(
        normalized&&
        state!=="bad"
      ){
        const current=
          S.pan.map.get(item.key);

        if(current){
          current.url=normalized;
          current.normalizedUrl=normalized;
          current.checkedNormalizedUrl=normalized;

          S.pan.map.set(
            item.key,
            current
          );
        }
      }
    });

    /*
      批量盘检后：
      1. bad 隐藏；
      2. ok 排前；
      3. 未检测排后。
    */
    buildPanGroups();
    renderPan();
  }catch(error){
    if(
      panToken!==S.pan.token||
      checkToken!==S.pan.checkToken
    ){
      return;
    }

    items.forEach(item=>{
      const old=
        S.pan.health.get(item.key);

      if(old?.state==="pending"){
        S.pan.health.set(
          item.key,
          {
            state:"uncertain"
          }
        );
      }
    });

    renderPan();

    throw error;
  }finally{
    if(
      panToken===S.pan.token&&
      checkToken===S.pan.checkToken
    ){
      S.pan.checking=false;
    }
  }
};

/* =========================================================
   7. 盘搜资源滚动：第二行锚点
   ========================================================= */
function panRowStep(){
  const root=$("panResults");

  const items=[
    ...root.querySelectorAll(
      ".pan-item"
    )
  ];

  if(items.length>=2){
    const difference=
      items[1].offsetTop-
      items[0].offsetTop;

    if(difference>0){
      return difference;
    }
  }

  return 56;
}

function setPanAnchorScroll(
  item,
  index
){
  if(!item){
    return false;
  }

  const root=$("panResults");
  const items=allPanItems();

  if(!Number.isInteger(index)){
    index=items.indexOf(item);
  }

  let target=0;

  /*
    第一条固定在第一行；
    第二条固定在第二行；
    从第三条开始，焦点固定在第二行。
  */
  if(index>=2){
    target=
      item.offsetTop-
      panRowStep();
  }else{
    target=0;
  }

  const maxScroll=
    Math.max(
      0,
      root.scrollHeight-
      root.clientHeight
    );

  target=Math.max(
    0,
    Math.min(
      target,
      maxScroll
    )
  );

  root.scrollTop=target;
  S.pan.scrollTop=target;

  requestAnimationFrame(()=>{
    if(document.activeElement===item){
      root.scrollTop=target;
      S.pan.scrollTop=target;
    }
  });

  return true;
}

ensurePanItemVisible=function(item){
  if(!item){
    return false;
  }

  const list=allPanItems();
  const index=list.indexOf(item);

  if(index>=0){
    return setPanAnchorScroll(
      item,
      index
    );
  }

  return false;
};

focusPanItem=function(item){
  if(!item){
    return false;
  }

  const list=allPanItems();
  const index=list.indexOf(item);

  focusEl(item);

  if(index>=0){
    setPanAnchorScroll(
      item,
      index
    );
  }

  return true;
};
